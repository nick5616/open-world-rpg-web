<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spell FX gallery</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #5b7398;
        overflow: hidden;
        font: 13px system-ui, sans-serif;
      }
      #label {
        position: fixed;
        left: 10px;
        top: 8px;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #cross {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7);
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <div id="cross"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
