# ---- fishing (playtest 2 "fishing"; docs/cr/026-fishing-emotes-photo.md) ----
# Cast a rod (items.yaml tool:fishing_rod) at open water: a lake, a river or
# the sea (the atlas node flags under the bobber; worldgen/README.md NODEP).
# The zone rolls the catch when the line lands (seeded: world seed, the
# character, the cast count), from the species that live in that water,
# biome, hour and weather, weighted by rarity. The bite comes after
# `biteS`; hook it within `hookWindowMs`; then the reel minigame
# (client/src/ui/fishing/minigame.ts): the fish pulls in bursts
# (strength, erratic), reeling raises the line's tension, and about
# `stamina` seconds of reeling against a calm fish land it. The zone checks
# the fight took at least the fastest possible time (1250 ms x stamina).
#   water: lake, river, sea · biomes: any, or atlas biome names
#   time: any, day (06-19), night (19-06), dawn (04:30-08:30), dusk (17-21)
#   weather: any, rain, clear · weight: kg [min, max] (skewed small)
fishing:
  rod: tool:fishing_rod
  castM: [3, 22]        # bobber distance from the angler (horizontal)
  minDepthM: 0.45       # water at least this deep under the bobber
  biteS: [3, 10]
  hookWindowMs: 1200
  maxFightS: 90
  castCooldownS: 1.5
  castBurst: 6          # casts in a burst, then one per castEveryS
  castEveryS: 4
  walkAwayM: 3          # moving this far from where you cast reels the line in
  seeM: 48              # others within this see you fishing (the emote event)
  rarities:
    common: {weight: 10, color: '#c9d1d9'}
    uncommon: {weight: 3.5, color: '#5fd16b'}
    rare: {weight: 1.0, color: '#4aa3ff'}
    legendary: {weight: 0.25, color: '#ffb02e'}
  species:
    silverfin: {name: Silverfin Minnow, item: fish:silverfin, rarity: common, water: [river, lake], biomes: [any], time: any, weather: any, weight: [0.05, 0.3], fight: {strength: 0.2, erratic: 0.25, stamina: 2.0},
      habitat: "Rivers and lakes everywhere", lore: "Every child's first fish. They school in the shallows and flash like dropped coins."}
    reed_perch: {name: Reed Perch, item: fish:reed_perch, rarity: common, water: [lake], biomes: [meadow, forest, wetland], time: day, weather: any, weight: [0.2, 1.2], fight: {strength: 0.35, erratic: 0.3, stamina: 2.6},
      habitat: "Reedy lowland lakes, by day", lore: "Striped green and gold to hide in the reeds. Bold, hungry and not very clever."}
    speckled_trout: {name: Speckled Trout, item: fish:speckled_trout, rarity: common, water: [river], biomes: [forest, highlands, meadow, snowpeak], time: any, weather: any, weight: [0.4, 2.5], fight: {strength: 0.45, erratic: 0.45, stamina: 3.0},
      habitat: "Cold, quick rivers", lore: "It holds in the current behind a stone and takes whatever the river brings it."}
    mudback_carp: {name: Mudback Carp, item: fish:mudback_carp, rarity: common, water: [lake], biomes: [wetland, meadow, badlands, forest], time: any, weather: any, weight: [1.0, 8.0], fight: {strength: 0.55, erratic: 0.2, stamina: 3.6},
      habitat: "Warm, muddy lakes", lore: "Old, heavy and patient. A mudback carp can live longer than the angler who hooks it."}
    tidewing_mackerel: {name: Tidewing Mackerel, item: fish:tidewing_mackerel, rarity: common, water: [sea], biomes: [any], time: any, weather: any, weight: [0.3, 1.6], fight: {strength: 0.5, erratic: 0.6, stamina: 2.6},
      habitat: "The open sea", lore: "Its fins are long enough to glide a little above the waves when it is chased."}
    sandflat_flounder: {name: Sandflat Flounder, item: fish:sandflat_flounder, rarity: common, water: [sea], biomes: [any], time: day, weather: any, weight: [0.4, 3.0], fight: {strength: 0.4, erratic: 0.25, stamina: 3.0},
      habitat: "Sandy sea shallows, by day", lore: "Both its eyes are on one side. It does not seem bothered by this."}
    bog_pike: {name: Bog Pike, item: fish:bog_pike, rarity: uncommon, water: [lake, river], biomes: [wetland, forest], time: dusk, weather: any, weight: [2.0, 12.0], fight: {strength: 0.7, erratic: 0.55, stamina: 3.8},
      habitat: "Wetland and forest waters at dusk", lore: "A mouth full of needles and a temper to match. It strikes at anything that moves in the evening light."}
    frostgill_char: {name: Frostgill Char, item: fish:frostgill_char, rarity: uncommon, water: [lake, river], biomes: [snowpeak, highlands], time: any, weather: any, weight: [0.8, 5.0], fight: {strength: 0.6, erratic: 0.4, stamina: 3.4},
      habitat: "Ice-cold mountain lakes and streams", lore: "Its gills are rimmed with frost even in summer. The highland folk say it keeps the water cold."}
    emberscale_loach: {name: Emberscale Loach, item: fish:emberscale_loach, rarity: uncommon, water: [river, lake], biomes: [badlands, highlands], time: day, weather: clear, weight: [0.2, 1.0], fight: {strength: 0.55, erratic: 0.8, stamina: 2.8},
      habitat: "Warm badland waters under a clear sky", lore: "Its scales are warm to the touch. Cooks swear it seasons itself."}
    gloam_eel: {name: Gloam Eel, item: fish:gloam_eel, rarity: uncommon, water: [lake, river, sea], biomes: [any], time: night, weather: any, weight: [0.8, 4.0], fight: {strength: 0.65, erratic: 0.75, stamina: 3.6},
      habitat: "Any water, only at night", lore: "It rises when the Unsung walk and glows faintly when it is afraid. It is usually afraid."}
    stormray: {name: Stormray, item: fish:stormray, rarity: rare, water: [sea], biomes: [any], time: any, weather: rain, weight: [4.0, 20.0], fight: {strength: 0.8, erratic: 0.6, stamina: 4.4},
      habitat: "The sea, in the rain", lore: "It comes to the surface when lightning is near and drinks the rain. Its sting tingles for days."}
    moonlit_koi: {name: Moonlit Koi, item: fish:moonlit_koi, rarity: rare, water: [lake], biomes: [meadow, forest, wetland], time: night, weather: clear, weight: [1.0, 6.0], fight: {strength: 0.6, erratic: 0.5, stamina: 4.0},
      habitat: "Still lowland lakes on clear nights", lore: "White and silver like the moon on the water. They say each one remembers a wish."}
    humming_sturgeon: {name: Humming Sturgeon, item: fish:humming_sturgeon, rarity: legendary, water: [lake, river], biomes: [highlands, snowpeak, forest], time: dawn, weather: any, weight: [20.0, 80.0], fight: {strength: 0.9, erratic: 0.5, stamina: 6.0},
      habitat: "Deep highland water at dawn", lore: "Older than the towers. It hums the Lodestone's note under the water, and the rod hums with it."}
    deepmaw: {name: Deepmaw, item: fish:deepmaw, rarity: legendary, water: [sea], biomes: [any], time: night, weather: rain, weight: [40.0, 160.0], fight: {strength: 1.0, erratic: 0.7, stamina: 7.0},
      habitat: "The open sea on a stormy night", lore: "Sailors' stories call it a reef until it opens its mouth. Nobody believes the ones who say they landed it."}

# ---- emotes (playtest 2; docs/cr/026-fishing-emotes-photo.md) ----
# Hold H for the wheel, or /emote <key> in chat. Event 1090 tells players
# within seeM (not the actor); `loop` ones hold until you move. Ids 1-19
# are wheel emotes; 20 (fishing: the line is out) and 21 (showing a catch)
# are sent by the zone's fishing code only, 22 (playing an instrument) by
# its music code (CR 028); townsfolk applauding a song are sent 3 (cheer).
emotes:
  seeM: 48
  burst: 3              # emotes in a burst, then one per everyS
  everyS: 1.5
  list:
    wave: {id: 1, name: Wave, durS: 2.2}
    bow: {id: 2, name: Bow, durS: 2.0}
    cheer: {id: 3, name: Cheer, durS: 2.4}
    point: {id: 4, name: Point, durS: 1.8}
    sit: {id: 5, name: Sit, loop: true}
    dance: {id: 6, name: Dance, loop: true}
    laugh: {id: 7, name: Laugh, durS: 2.4}
    shrug: {id: 8, name: Shrug, durS: 1.6}
    salute: {id: 9, name: Salute, durS: 2.0}
    rest: {id: 10, name: Rest by the fire, loop: true}
    fishing: {id: 20, name: Fishing, loop: true, system: true}
    show_catch: {id: 21, name: Show a catch, durS: 2.6, system: true}
    playing: {id: 22, name: Playing music, loop: true, system: true}   # CR 028: value = the instrument id

# ---- instruments (playtest 2, CR 028; docs/cr/028-instruments.md) ----
# Carry one (items.yaml instrument:*: the merchants below, a camp workbench,
# a forge) and press U to play: the keyboard rows are the notes of a scale.
# The client sends what you play in small batches (Interact 120); the zone
# relays them (Event 1120) to the players within hearM, who hear you from
# where you stand. `range` is the playable MIDI range (notes outside it move
# by octaves into it); `sustain` instruments hold a note while its key is
# down (a note-off follows); `voice` is the client's synthesis.
instruments:
  hearM: 40
  batchMs: 50           # the client sends what you played every batchMs (5 note events at most)
  batchBurst: 12        # zone: Interact 120 messages, a burst ...
  batchesPerS: 25       # ... then this many per second (the generic Interact limiter does not apply)
  notesBurst: 40        # zone: notes started, a burst ...
  notesPerS: 16         # ... then this many per second; the rest are dropped
  holdMaxS: 8           # listeners end a held note whose note-off never came
  song:
    gapS: 4             # this much silence ends a song
    minNotes: 16        # a song is at least this many notes ...
    minS: 8             # ... over at least this long
  applause:
    npcM: 20            # townsfolk this close applaud a finished song (emote 3 to everyone near them)
    maxNpcs: 6
    everyS: 45          # one ovation per player per this long
  fireside:
    songS: 30           # play this long at night within camps.yaml fire.warmthM of a burning campfire: you (and listeners by the fire) rise Rested
    gapS: 5             # a pause longer than this doesn't count
  jam:
    bpm: [60, 180]      # the shared metronome (Event 1123)
    defaultBpm: 96
  list:
    lute: {id: 1, item: instrument:lute, name: Lute, voice: pluck, range: [40, 84], sustain: false, pose: strum}
    wooden_flute: {id: 2, item: instrument:wooden_flute, name: Wooden Flute, voice: flute, range: [60, 96], sustain: true, pose: flute}
    hand_drum: {id: 3, item: instrument:hand_drum, name: Hand Drum, voice: drum, range: [36, 84], sustain: false, pose: drum}
    handbells: {id: 4, item: instrument:handbells, name: Handbells, voice: bell, range: [60, 96], sustain: false, pose: bells}
  # Sold by merchants (content.yaml reputation shops: general, provisions, herbalist, tools, smith).
  wares:
    general: [{item: instrument:lute, price: 60, stock: 2}, {item: instrument:wooden_flute, price: 24, stock: 4}, {item: instrument:hand_drum, price: 36, stock: 3}]
    tools: [{item: instrument:handbells, price: 80, stock: 2}, {item: instrument:wooden_flute, price: 22, stock: 3}]
