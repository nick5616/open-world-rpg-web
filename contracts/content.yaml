# World content (playtest 2, "add some other content to this game";
# docs/cr/022-content.md): townsfolk side quests and story quests, world
# events, dungeons, lore tablets, the creature codex, feats and titles,
# herb foraging and town reputation.
#
# One definition, generated by `npm run gen` into:
#   contracts/ts/src/gen/content.ts           (client: codex, lore, feats, herbs, event names)
#   server/pkg/contentdefs/content_gen.json   (zone: generators, rules, rewards; embedded)
# The generator (contracts/codegen/lib/content.mjs) checks every reference
# against combat.yaml (enemy keys, the codex covers every enemy) and
# items.yaml (rewards, gathering, herbs, rep wares). Never hand-edit the
# generated files.
#
# Text placeholders (filled by the zone): {giver} the quest giver's name,
# {town} their settlement, {place} a named place, {where} "420 m north-east
# of {town}", {creatures} what prowls there, {n} a count, {item} an item
# name, {other} another settlement, {otherNpc} someone there, {villager} a
# lost villager. All names are original (no other game's names).
version: 1

# ---- reputation (per character per settlement) ----
reputation:
  # A tier is reached at `min` reputation. Completing a side quest for a
  # town's folk raises its reputation; better tiers unlock better stock.
  tiers:
    - {key: stranger, name: Stranger, min: 0}
    - {key: known, name: Known, min: 20}
    - {key: trusted, name: Trusted, min: 60}
    - {key: honored, name: Honored, min: 120}
  # Extra wares by tier and shop (general, provisions, herbalist, tools,
  # smith = blacksmiths). Each tier adds to the tiers below it.
  wares:
    known:
      general: [{item: tool:rope, price: 8, stock: 6}, {item: food:berry_tart, price: 7, stock: 6}]
      provisions: [{item: food:berry_tart, price: 7, stock: 8}]
      herbalist: [{item: herb:emberroot, price: 6, stock: 10}, {item: herb:frostcap, price: 6, stock: 10}]
      tools: [{item: ingot:silver, price: 30, stock: 4}]
      smith: [{item: armor:iron_helm, price: 55, stock: 1}, {item: ammo:silver_arrow, price: 3, stock: 40}]
    trusted:
      general: [{item: potion:greater_health, price: 60, stock: 3}]
      provisions: [{item: food:stew, price: 7, stock: 12}]
      herbalist: [{item: potion:greater_health, price: 60, stock: 4}, {item: herb:glowmoss, price: 9, stock: 8}]
      tools: [{item: ingot:sunsteel, price: 60, stock: 2}]
      smith: [{item: weapon:silver_sword, price: 180, stock: 1}, {item: armor:silver_cuirass, price: 240, stock: 1}]
    honored:
      general: [{item: blueprint:silver_arrow, price: 60, stock: 1}]
      provisions: [{item: food:emberroot_skewer, price: 10, stock: 10}]
      herbalist: [{item: potion:dawnroot_elixir, price: 120, stock: 2}]
      tools: [{item: ingot:starmetal, price: 140, stock: 2}]
      smith: [{item: weapon:starmetal_sword, price: 820, stock: 1}, {item: blueprint:starmetal_sword, price: 300, stock: 1}]

# ---- side quests from townsfolk ----
sidequests:
  # Every settlement has 2-4 quest givers among its townsfolk (never the
  # blacksmith or the bounty keeper: they have their own work), picked
  # from the world seed and the settlement. Each giver offers one quest at
  # a time; finishing it brings the next one (a deterministic sequence per
  # giver, so two players talking to the same farmer hear the same story).
  givers: {min: 2, max: 4, roles: [farmer, villager, merchant, innkeeper, guard]}
  # How far places may be from the giver's settlement.
  near: {min: 140, max: 1300}
  # Creature words by biome (meadow, forest, highlands, snowpeak, badlands, wetland).
  creatures: [meadow prowlers, forest beasts, highland beasts, frost-hardened beasts, dust-crawlers, bog-things]
  # Lost villagers (rescue quests).
  villagers: [Ailsa, Brodie, Catriona, Dougal, Effie, Fergus, Greer, Hamish, Isla, Jamie, Kenna, Lachie, Morag, Niall, Orla, Peigi, Ruaridh, Senga, Tormod, Una]
  kinds:
    hunt:
      weight: 3
      titles: ["Trouble at {place}", "Thin the {creatures}", "The prowlers of {place}"]
      offer:
        - "Since the thaw, {creatures} have been bold around {place}. I lost two hens and nearly my nerve. Cull {n} of them, would you?"
        - "My cousin won't walk past {place} any more. {creatures}, she says, and more every week. Put down {n} and I'll see you paid."
        - "Something's stirred the {creatures} near {place}. Clear out {n} before they find the road."
      step: "Cull {n} creatures near {place}"
      note: "{place}, {where}. Anything that isn't a demon counts."
      back: "Tell {giver} in {town} it's done"
      thanks: ["You smell of blood and bracken, which means you did it. Thank you.", "Hah! I'll sleep tonight. Here, take this.", "Good. The path to {place} is ours again."]
      n: [4, 7]
      radius: 110
      gold: [16, 28]
      xp: [70, 110]
      rep: 12
    gather:
      weight: 3
      titles: ["Supplies for {giver}", "A basket of {item}", "What {giver} needs"]
      offer:
        - "I'm short on {item}, and the season won't wait. Bring me {n} and I'll pay fair."
        - "Could you find me {n} {item}? My hands aren't what they were for the gathering."
        - "{n} {item}. That's all I need to get through the week. Will you?"
      step: "Bring {n} {item} to {giver}"
      note: "{giver} is in {town}. Talk to them with the {item} in your pack."
      thanks: ["That'll do nicely. Here's your due.", "Just what I needed, and fresher than the market's.", "You're a help, truly."]
      items:
        - {item: herb:heartleaf, qty: [3, 6]}
        - {item: herb:emberroot, qty: [2, 4]}
        - {item: herb:frostcap, qty: [2, 4]}
        - {item: herb:glowmoss, qty: [2, 4]}
        - {item: herb:duskpetal, qty: [2, 4]}
        - {item: hide:wolf, qty: [2, 3]}
        - {item: meat:raw, qty: [3, 5]}
        - {item: ore:copper, qty: [3, 5]}
      gold: [14, 24]
      xp: [50, 90]
      rep: 10
    deliver:
      weight: 2
      titles: ["A parcel for {other}", "Word to {otherNpc}", "Carried by hand"]
      offer:
        - "Would you take this to {otherNpc} in {other}? It's nothing much, but it matters to me. Mind the weather on the road."
        - "{otherNpc} in {other} is waiting on this. The carters won't go that way any more. You will, won't you?"
        - "A small parcel for {otherNpc}, over in {other}. They'll know what it means."
      step: "Deliver the parcel to {otherNpc} in {other}"
      note: "{other}, {where}. Talk to {otherNpc} there."
      thanks: ["Ah, from {giver}! Thank you, traveller. Take this for your trouble.", "I'd given up on this. Here, you've earned it.", "Safe on the road, I hope? Here's something for the boots."]
      gold: [20, 34]
      xp: [80, 130]
      rep: 12
    explore:
      weight: 2
      titles: ["What lies at {place}", "Eyes on {place}", "The old stones of {place}"]
      offer:
        - "Folk say lights move at {place} after dark. I'd know if it's true before I send the children berrying. Go and look, then tell me."
        - "Nobody's been out to {place} since my father's day. Is it still standing? I'd pay to know."
        - "I dreamt of {place} three nights running. Humour an old fool: go there and come back."
      step: "Go to {place}"
      note: "{place}, {where}."
      back: "Report back to {giver} in {town}"
      thanks: ["Still standing, is it? Well. That settles an argument. Here.", "Lights, you say? Hm. Best leave it be. Thank you for looking.", "You've a walker's legs. Take this."]
      gold: [14, 24]
      xp: [80, 120]
      rep: 10
    rescue:
      weight: 2
      titles: ["Where is {villager}?", "Lost near {place}", "Bring {villager} home"]
      offer:
        - "{villager} went out toward {place} two days ago and hasn't come back. Please. Find them and bring them home."
        - "Have you seen {villager}? They went looking for mushrooms near {place}. They always come back by supper."
        - "{villager} took a wrong turn chasing a goat, the fool, somewhere near {place}. Bring them back to {town}?"
      step: "Find {villager} near {place}"
      note: "{place}, {where}. Look around the camp."
      escort: "Lead {villager} home to {town}"
      escortNote: "{villager} follows you. Keep them close: they won't go far alone."
      back: "Talk to {giver}"
      found: "Oh! You came for me? Lead on, I'll stay close."
      thanks: ["{villager}! Oh, you're safe. Traveller, I can't thank you enough.", "Home in one piece. That's worth more than coin, but have the coin anyway.", "You brought them back. The whole town will hear of this."]
      gold: [24, 38]
      xp: [100, 150]
      rep: 16

# ---- handcrafted story quests (tie the regions together) ----
stories:
  # Each story is offered by its role in any town; places are resolved
  # around the town where it is accepted ("home"), the nearest other town
  # ("next") and the nearest town in another region ("far"). Steps:
  # talk(role, town), reach(site, near), read(site, near), attune, kill(n,
  # site, near), clear(site, near), give(role, town), dungeon(near).
  # Sites: shrine, ruin, watchtower, tower, banditcamp, landmark, dungeon.
  lodestone_hum:
    title: The Lodestone's Hum
    role: innkeeper
    offer: "You feel it too, don't you? The hum under the floorboards, under the hills. My grandmother called it the Lodestone singing. She said the shrines remember what it sings about. Find out for me?"
    gold: 120
    xp: 700
    rep: 20
    items: 1
    feat: hum
    steps:
      - {kind: reach, site: shrine, near: home, text: "Listen for the hum at {place}", note: "{place}, {where}. Old shrines are where it is loudest.", say: ""}
      - {kind: read, site: shrine, near: home, text: "Read the tablet at {place}", note: "The tablet stands among the stones of {place}."}
      - {kind: attune, text: "Attune to a tower crystal", note: "Climb any of the great towers and lay your hand on the crystal. The hum is a song the crystals answer."}
      - {kind: talk, role: blacksmith, town: next, text: "Ask {npc} in {other} about lodestone iron", note: "Smiths know iron. {other}, {where}.", say: "Lodestone iron? Aye. It turns in the hand toward the towers. Ancient stuff. The ruins are full of it, and full of things that guard it."}
      - {kind: kill, n: 6, site: ruin, near: next, text: "Clear the guardians around {place}", note: "{place}, {where}. Six of whatever keeps watch there."}
      - {kind: talk, role: innkeeper, town: home, text: "Tell {giver} in {town} what you learned", note: "", say: "The crystals answer the hum... and the ruins guard its iron. Then the towers are not watchtowers at all. They're tuning forks. Thank you, friend. Drink's on the house, forever."}
  old_watch:
    title: Embers of the Old Watch
    role: guard
    altRole: bounty
    offer: "Before the dark came every night, there was the Watch: a fire on every hilltop, one town to the next. The last of their banners hangs in a bandit camp now, if you believe the drunks. I believe the drunks."
    gold: 140
    xp: 750
    rep: 20
    items: 1
    feat: watch
    steps:
      - {kind: reach, site: watchtower, near: home, text: "Climb to the old watchtower at {place}", note: "{place}, {where}. The Watch lit its fires there."}
      - {kind: clear, site: banditcamp, near: home, text: "Take back the banner from {place}", note: "{place}, {where}. Clear the camp.", grant: quest:watch_banner}
      - {kind: give, role: bounty, town: far, item: quest:watch_banner, text: "Carry the banner to {npc} in {other}", note: "{other}, {where}. The Watch had a hall there once.", say: "The Watch banner. I never thought I'd see it. We'll hang it where the lantern-fire can see it. Go well, Watcher."}
  drowned_bell:
    title: The Bell Beneath
    role: farmer
    offer: "When the wind is from the old stones, I hear a bell. Down under the ground, like. My dad said there's vaults under the ruins, sealed with riddles. Open one and tell me if there's a bell. Please. I can't sleep for it."
    gold: 160
    xp: 900
    rep: 20
    items: 1
    feat: bell
    steps:
      - {kind: reach, site: dungeon, near: home, text: "Find the sealed vault at {place}", note: "{place}, {where}. Look for the vault door among the stones."}
      - {kind: dungeon, site: dungeon, near: home, text: "Open the vault at {place} and defeat its keeper", note: "Solve the seal, then face what waits inside."}
      - {kind: talk, role: farmer, town: home, text: "Tell {giver} in {town} about the bell", note: "", say: "No bell? Just a keeper, and a chest. Hm. Then what have I been hearing? ...Never mind. You've done more than enough."}

# ---- world events (zone-scheduled, announced to players nearby) ----
events:
  # Every everyS the zone looks at each player who has no event within
  # minGapM; with chancePerPlayer it starts one spawnMinM-spawnMaxM away
  # (on open, walkable ground it owns, never in a settlement). At most
  # maxActive per zone. Players within announceM hear of it (a toast and
  # a compass marker) and keep hearing until it ends.
  scheduler: {everyS: 75, chancePerPlayer: 0.3, maxActive: 3, minGapM: 900, spawnMinM: 160, spawnMaxM: 380, announceM: 650, playerCooldownS: 240}
  kinds:
    starfall:
      name: Starfall
      weight: 3
      announce: "A star has fallen {where}! Something guards the shard."
      success: "The starfall shard is yours to take."
      fail: "The shard's glow fades and it crumbles to ash."
      durationS: 480
      comp: [starfall_sentinel, wisp, wisp]
      elite: shielded
      radius: 30
      reward: {gold: [30, 60], xp: 260, items: 1, luck: 2.5, ore: ore:starmetal, oreQty: [2, 4]}
    caravan:
      name: Caravan Ambush
      weight: 3
      announce: "Bandits are attacking a merchant caravan {where}! Defend it."
      success: "The caravan rolls on. The merchants won't forget this."
      fail: "The caravan is lost. The bandits scatter with the goods."
      durationS: 300
      waves: [[cutthroat, cutthroat, archer], [cutthroat, archer, brute], [brute, archer, archer, cutthroat]]
      caravanHp: 100
      # Caravan health lost per second for each bandit alive within 18 m of it.
      damagePerBandit: 1.2
      radius: 26
      reward: {gold: [40, 70], xp: 300, items: 1, luck: 2.0}
    behemoth:
      name: The Wandering Behemoth
      weight: 2
      announce: "The Thornhide Behemoth is on the move {where}. Bring friends."
      success: "The Behemoth falls with a sound like a felled oak."
      fail: "The Behemoth wanders off into the hills."
      durationS: 900
      comp: [thornhide_behemoth]
      roamSpeed: 1.6
      roamLegM: 260
      radius: 40
      reward: {gold: [70, 120], xp: 500, items: 2, luck: 3.0}
    wildhunt:
      name: The Wild Hunt
      weight: 3
      night: true
      announce: "Horns in the dark {where}... The Wild Hunt rides tonight."
      success: "The Huntsman's horn is silent. The hunt is broken."
      fail: "The horns fade toward the hills. The hunt passes on."
      durationS: 360
      comp: [hunt_master, gloamhound, gloamhound, gloamhound, gloamhound]
      radius: 30
      reward: {gold: [45, 80], xp: 360, items: 1, luck: 2.5}
    glintfox:
      name: The Glintfox
      weight: 2
      announce: "A Glintfox has been spotted {where}, its tail full of stolen gems! Catch it before it vanishes."
      success: "The Glintfox drops its hoard!"
      fail: "The Glintfox slips away into the brush."
      durationS: 90
      comp: [glintfox]
      radius: 18
      reward: {gold: [60, 110], xp: 150, items: 0, luck: 1.0, gems: [2, 4]}

# ---- dungeons (sealed vaults under ruins and shrines) ----
dungeons:
  # One per region: the ruin (smaller than a boss ruin) nearest the
  # region's middle, else a shrine. Discovered within discoverM.
  discoverM: 70
  activeM: 150
  resetS: 900
  names: ["The Undervault of {site}", "The Sealed Hall of {site}", "The Vault beneath {site}"]
  door: "A vault door of grey stone, sealed with a glowing sigil."
  puzzles:
    levers:
      name: The Three Levers
      hint: "Three levers, marked with the sun, the moon and the star. The inscription reads: \"{order}, and the way is open.\""
      wrong: "The levers clatter back. That was not the order."
      parts: 3
    plates:
      name: The Weighing Stones
      hint: "Three pressure stones. The inscription reads: \"All must bear weight at once.\" They stay down for {hold} seconds."
      holdS: 14
      parts: 3
    braziers:
      name: The Cold Braziers
      hint: "Two cold braziers flank the door. The inscription reads: \"Give the watchers fire.\""
      element: fire
      parts: 2
    font:
      name: The Weeping Font
      hint: "Water wells from a cracked font and runs over the sigil. The inscription reads: \"Still the weeping, and I will listen.\""
      element: ice
      parts: 1
  # Elite packs that guard the vault yard (spawned when someone comes near).
  packs: [[sentinel, wisp, sentinel], [cutthroat, archer, brute], [crystal_golem, gloom_bat, gloom_bat]]
  boss: vault_keeper
  chest: {gold: [60, 120], minRarity: rare, items: 1, luck: 3.0, cooldownH: 20}

# ---- lore tablets (ruins, shrines and watchtowers each hold one) ----
tablets:
  - {key: first_hum, title: "The First Hum", text: "Before the towns, before the roads, there was only the Lodestone, sleeping in the deep rock. It dreamt, and its dreaming was a hum, and where the hum was loudest, the first people built their fires."}
  - {key: tower_builders, title: "The Tower Builders", text: "They did not build the towers to watch for enemies. They built them to listen. Each crystal is a shard of the Lodestone's voice, set high so the wind could carry it from valley to valley."}
  - {key: the_breaking, title: "The Breaking", text: "When the Lodestone woke, it did not wake gently. The ground split, the shards scattered, and the night grew teeth. We call the teeth demons. The old ones called them the Unsung: things born where the hum went quiet."}
  - {key: sunsteel_oath, title: "The Sunsteel Oath", text: "Iron drinks the dark. Silver turns it aside. But sunsteel, ore that has slept a hundred years in a shaft of daylight, remembers the sun, and the Unsung cannot bear to be remembered at."}
  - {key: the_watch, title: "Of the Watch", text: "There were a thousand fires on a thousand hills, and every fire could see two more. While the Watch burned, no town was ever alone in the dark. The last fire went out in a winter no one wrote down."}
  - {key: vault_wardens, title: "The Vault Wardens", text: "We sealed the deep vaults with riddles, not locks. A lock can be broken by any brute. A riddle opens only for one who stops and thinks, and the Unsung never stop."}
  - {key: wardbloom, title: "On Wardbloom", text: "Plant it in a ring and the dark walks around. Nobody knows why. The gardeners say the flowers hum, too quietly for us, loudly enough for the night."}
  - {key: the_glintfox, title: "The Glintfox", text: "A fox with a tail like a jeweller's purse. It steals whatever glitters and runs from whoever looks. Children are told that if you catch one, it will drop everything it ever took. Children are told many things."}
  - {key: the_hunt, title: "The Wild Hunt", text: "On the darkest nights, the Huntsman rides with his hollow hounds. He does not hunt deer. He hunts the brave, because the brave are the only ones out after dark."}
  - {key: the_behemoth, title: "The Thornhide", text: "It is older than the towns. It eats nothing and sleeps nowhere. It walks from one end of the world to the other and back, and where it has walked the briars grow thick for a year."}
  - {key: falling_stars, title: "Falling Stars", text: "When a star falls, the sky gives back a shard of what the Breaking scattered. Starmetal, the smiths call it. The guardians that rise with it are only the sky's way of asking whether you deserve it."}
  - {key: the_caravans, title: "The Road Charter", text: "Let it be written: any merchant who travels between two lit towns travels under the protection of both. Let it also be written: the bandits never signed this."}
  - {key: shrine_keepers, title: "The Shrine Keepers", text: "The keepers tended the shrines until the last of them grew old. They left their tablets for whoever came after, so that the hum would never be entirely forgotten."}
  - {key: void_glass, title: "Voidglass", text: "Deep under the oldest hills the rock turns black and cold and clear. Look into it and you see nothing at all. That is the most frightening thing about it."}
  - {key: the_slimes, title: "A Note on Slimes", text: "Dewdrop slimes are harmless, mostly. They are the morning dew that the Lodestone's hum has taught to wander. Be kind to them. Or don't. They will not remember either way."}
  - {key: last_keeper, title: "The Last Keeper", text: "I am the last who remembers the song. I have written it on every stone I could reach. If you are reading this, then the stones did their work, and so must you. Listen."}

# ---- creature codex (unlocked on the first kill of each creature) ----
codex:
  boar: {habitat: "Meadows and forest edges", lore: "Thornback boars charge first and think never. The bristles on their spine are stiff enough to stop an arrow."}
  wolf: {habitat: "Forests and meadows", lore: "Moss grows in the fur of the old ones. They hunt in pairs and remember the faces of those who escape them."}
  ram: {habitat: "Highlands and snowpeaks", lore: "A crag ram will charge a cliff to prove it is the stronger. It usually is."}
  stalker: {habitat: "Snowpeaks", lore: "Its breath freezes in the air and falls as needles. The rime stalker follows tracks in the snow for days."}
  scuttler: {habitat: "Badlands and wetlands", lore: "Armoured, patient and venomous. Dust scuttlers wait under the sand for a footstep."}
  lurker: {habitat: "Wetlands and forests", lore: "The bog lurker looks like a mossy log until it does not. It spits mud to blind its prey."}
  cutthroat: {habitat: "Bandit camps and roads", lore: "Most cutthroats were farmers once. The nights took their farms; the roads took the rest of them."}
  archer: {habitat: "Bandit camps and ruins", lore: "Bandit archers keep their distance and their arrows cheap. Close the gap and they panic."}
  brute: {habitat: "Bandit camps", lore: "Big, slow and proud of it. A bandit brute stamps the ground before it strikes; listen for it."}
  sentinel: {habitat: "Ruins, shrines and watchtowers", lore: "Stone guardians set by the vault wardens. They still keep their old posts, long after anyone remembers the orders."}
  wisp: {habitat: "Shrines and ruins", lore: "A flicker of the hum given a mind. Wisps guard the places the Lodestone's song once filled."}
  ember_imp: {habitat: "Fire-touched regions", lore: "Ember imps are born where a wildfire burned hottest. They giggle. Nobody likes the giggling."}
  frost_mote: {habitat: "Ice-touched regions", lore: "A snowflake that refused to melt, then refused to stop growing."}
  spark_wisp: {habitat: "Storm-touched regions", lore: "Where lightning strikes twice, a spark wisp is left behind to make it three times."}
  mud_golem: {habitat: "Earth-touched regions", lore: "Riverbank clay that the hum woke up. It is slow, heavy, and very sure of itself."}
  gale_harpy: {habitat: "Wind-touched regions", lore: "Gale harpies ride the updrafts above cliffs and dive on anything that looks soft."}
  lumen_moth: {habitat: "Light-touched regions", lore: "Drawn to lanterns, campfires and wanderers carrying either. Its wings leave glowing dust on your sleeves."}
  shade: {habitat: "Dark-touched regions", lore: "A shadow that forgot what cast it. Shades are drawn to warmth, which they cannot hold."}
  void_mite: {habitat: "Void-touched regions", lore: "Small, fast and wrong. Void mites chew holes in the air itself."}
  cave_crawler: {habitat: "Caves", lore: "Pale, many-legged and blind. Cave crawlers find you by the sound of your heartbeat."}
  gloom_bat: {habitat: "Caves", lore: "They hang in their thousands in the deep chambers and wake all at once."}
  crystal_golem: {habitat: "Deep caves", lore: "Grown, not made, from the crystal veins of the deep. Its fists ring like bells."}
  slime: {habitat: "The Haven and quiet lands", lore: "Morning dew that learned to wander. Mostly harmless. Mostly."}
  moss_slime: {habitat: "The Haven and quiet lands", lore: "An older, greener slime. Moss grows in it, and small snails live on the moss."}
  gloamling: {habitat: "Everywhere, at night", lore: "The lesser Unsung. They come at dusk in packs and flee from sunsteel and Light."}
  cinder_fiend: {habitat: "Fire regions, at night", lore: "A greater Unsung wreathed in cinders. Ordinary steel only makes it angry."}
  rime_wraith: {habitat: "Ice regions, at night", lore: "It hurls lances of black ice from afar. Only Light or sunsteel will end it."}
  storm_ghoul: {habitat: "Storm regions, at night", lore: "A greater Unsung that rides the lightning. It rushes faster than you can run."}
  grave_brute: {habitat: "Earth regions, at night", lore: "It slams the ground hard enough to open old graves. Some say that is the point."}
  gale_reaver: {habitat: "Wind regions, at night", lore: "Its claws tear the wind itself. Stay out of its wide arc."}
  umbral_stalker: {habitat: "Dark regions, at night", lore: "It leaps from shadow to shadow and lands where you were standing."}
  void_maw: {habitat: "Light and void regions, at night", lore: "A mouth that opens onto nothing. It gnashes in a wide circle around itself."}
  starless_sovereign: {habitat: "New-moon nights", lore: "A lord of the Unsung that walks only when the moon is dark. Its meteors fall on everyone who dares to stand against it."}
  warden: {habitat: "Great ruins, sunken temples, demon lairs", lore: "The vault wardens' greatest work. A Warden still guards the heart of every great ruin."}
  archon: {habitat: "Wizard towers", lore: "The tower-wizards left behind more than books. An Archon still studies in each tower, and resents interruptions."}
  glintfox: {habitat: "Anywhere, rarely", lore: "A thief with a tail full of stolen gems. It never fights, only runs. Catch it and it drops its hoard."}
  gloamhound: {habitat: "The Wild Hunt, at night", lore: "Hollow hounds of the Wild Hunt. Unlike the Unsung, they bleed like any beast."}
  hunt_master: {habitat: "The Wild Hunt, at night", lore: "The Huntsman. Antlered, silent, and patient. He hurls his spear at whoever runs."}
  starfall_sentinel: {habitat: "Where stars fall", lore: "It rises from the crater with the shard, built of starmetal and old light, and tests anyone who comes for the prize."}
  thornhide_behemoth: {habitat: "Wanders between regions", lore: "Older than the towns. Briars grow wherever it has walked. It shakes the earth when it is angry, and it is easily angered."}
  vault_keeper: {habitat: "Sealed vaults beneath ruins", lore: "The last guardian of a sealed vault. When it raises its staff, a sigil burns on the ground: do not be standing in it."}

