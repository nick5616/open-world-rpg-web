  # MANA_PER_LEVEL, regen) and shared/spells.js MANA_BY_TIER.
  base: 100
  perLevel: 7
  regenPerS: 11
  regenPerLevel: 0.5
  byTier: [0, 10, 16, 22, 28, 34, 40, 50, 58, 65, 70, 75]

