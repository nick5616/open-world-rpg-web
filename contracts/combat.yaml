  greater: {fire: cinder_fiend, ice: rime_wraith, lightning: storm_ghoul, earth: grave_brute, wind: gale_reaver, light: void_maw, dark: umbral_stalker, void: void_maw}
  lord: starless_sovereign

tables:
  # Spec 8: each biome, depth band and region element has its own enemy
  # table. A group draws from the biome (or site) table, mixes in the
  # region element's elemental, and deeper bands add the cave families.
  # Playtest 1 (CR 012): the area's difficulty tier (below) can replace
  # part or all of a group with the beginner table.
  beginner: [slime, slime, moss_slime]
  biome:
    meadow: [boar, wolf, cutthroat]
    forest: [wolf, boar, lurker]
    highlands: [ram, wolf, sentinel]
    snowpeak: [stalker, ram, wolf]
    badlands: [scuttler, cutthroat, archer]
    wetland: [lurker, boar, scuttler]
  element:
    fire: ember_imp
    ice: frost_mote
    lightning: spark_wisp
    earth: mud_golem
    wind: gale_harpy
    light: lumen_moth
    dark: shade
    void: void_mite
  site:
    bandit: [cutthroat, cutthroat, archer, brute]
    guardian: [sentinel, wisp, sentinel]
    ruin: [cutthroat, archer, sentinel]
  depth:
    # cave depth bands (spec 7; WP09 caves call TableFor with the band)
    shallow: {extra: [cave_crawler], levelBonus: 0, eliteChance: 0.1}
    mid: {extra: [cave_crawler, gloom_bat], levelBonus: 4, eliteChance: 0.2}
    deep: {extra: [gloom_bat, crystal_golem], levelBonus: 8, eliteChance: 0.35}
    surface: {extra: [], levelBonus: 0, eliteChance: 0.15}

leveling:
  # Playtest 1 (CR 012): what a character level gives, applied by the zone
  # (combat.Player.SetLevel, the movement state's stamina wheel) and shown by
  # the client's character panel (C). Mana keeps `mana.base/perLevel`.
  # Curve vs enemies (decision 0021): enemies gain +10 % health and +6 %
  # damage per level (WP13); players gain +10 % damage (the same as enemy
  # health, so an at-level common takes the level-1 number of hits at any
  # level: 2-5) and +12 health (12 % of the base, ahead of enemy damage, so
  # a levelled character survives more) per level. Over-levelled players
  # feel it: 8 levels above an area, commons die in about two thirds of the
  # hits. Weapon skill (+1 %/level) and gear come on top.
  health: {base: 100, perLevel: 12}
  damagePctPerLevel: 10
  # Stamina wheel: +2 per level above 1 (capped), on top of the 100 start.
  stamina: {perLevel: 2, max: 60}
  # Spell skill points (spec 8 "character level still exists for health and
  # spell skill points"): base + one per level; tower attunements add more.
  skillPoints: {base: 1, perLevel: 1}
  # Tree tiers unlock with level (skill-point learning only; tomes still
  # teach anything): tier >= key needs character level >= value.
  spellTierLevels: {4: 3, 6: 6, 8: 10, 10: 14, 12: 18}
  # First attunement of each tower crystal (Interact 10 action 2 on its top):
  # a permanent boon (spec 8: stamina upgrades come from rare finds at towers).
  attune: {stamina: 8, health: 5, skillPoints: 1, xp: 100}

difficulty:
  # Playtest 1 (CR 012, decision 0021): discovery-stamped area difficulty.
  # The world is cut into square areas of cellM metres (4 x 4 chunks, the
  # zone's 256 m combat grid). The first player to come near an area stamps
  # its level persistently (Postgres area_difficulty, first writer wins, so
  # every zone of a world agrees) from their character level, pulled toward
  # the already-stamped neighbours (mean of the 8 around it, weight
  # neighbourWeight) and clamped to within maxStep of them, plus up to
  # dangerBonus from the generator's region danger. Areas whose centre lies
  # within havenRadiusM of the world spawn are the Haven: fixed level 1,
  # beginner creatures only, no demons, never stamped.
  cellM: 256
  havenRadiusM: 420
  maxStep: 3
  neighbourWeight: 0.5
  dangerBonus: 2
  maxLevel: 30
  # A player stamps every unstamped area whose square is within stampReachM
  # of them (more than ENEMY_SPAWN_M, so a group's area is known before it
  # spawns).
  stampReachM: 200
  # Players below demonSafeBelow are not hunted within demonSafeMarginM of
  # any ward (towns stay safe havens a little beyond their gardens).
  demonSafeBelow: 6
  demonSafeMarginM: 90
  # Tiers by area level (the last whose minLevel <= level; the Haven is its
  # own tier). beginner: share of camp/pack members drawn from the beginner
  # table (1 = all); elite: multiplier on the elite chance; demons: on night
  # hunters per player; greater: on the greater-demon chance; demonSpeed: on
  # demon speed; lords, bosses, defense: whether lords rise, boss arenas
  # spawn, town defense events run.
  tiers:
    - {key: haven, name: Haven, minLevel: 0, beginner: 1, elite: 0, demons: 0, greater: 0, demonSpeed: 1, lords: false, bosses: false, defense: false}
    - {key: quiet, name: Quiet Lands, minLevel: 1, beginner: 0.5, elite: 0, demons: 0, greater: 0, demonSpeed: 1, lords: false, bosses: true, defense: false}
    - {key: wilds, name: The Wilds, minLevel: 4, beginner: 0, elite: 0.5, demons: 0.35, greater: 0, demonSpeed: 0.85, lords: false, bosses: true, defense: false}
    - {key: perilous, name: Perilous Lands, minLevel: 8, beginner: 0, elite: 1, demons: 0.7, greater: 0.6, demonSpeed: 1, lords: false, bosses: true, defense: true}
    - {key: dread, name: Dreadlands, minLevel: 13, beginner: 0, elite: 1.3, demons: 1, greater: 1, demonSpeed: 1, lords: true, bosses: true, defense: true}
    - {key: deadly, name: The Deadlands, minLevel: 20, beginner: 0, elite: 1.6, demons: 1.25, greater: 1.5, demonSpeed: 1.05, lords: true, bosses: true, defense: true}

pvp:
  # Playtest 2 (CR 019): opt-in PvP between players who are not in the same
  # party, and duels between party members. Applied by the zone
  # (server/zone/internal/game/pvp.go, duel.go; combat.World.ClaimPlayer) and
  # shown by the client (client/src/ui/pvp).
  # Player-vs-player damage = what the same hit would deal to a physical
  # enemy (level, skill, gear, crit) x damageMult, then the victim's armor and
  # shields. Applies to open PvP and to duels.
  damageMult: 0.5
  # Turning the flag off takes flagOffDelayS; a PvP hit given or taken while
  # it waits restarts the wait (no flagging off to escape a fight).
  flagOffDelayS: 10
  # Flag requests are at least toggleCooldownS apart, and refused within
  # combatLockS of dealing or taking any damage.
  toggleCooldownS: 5
  combatLockS: 6
  # Safe zones (no open PvP): every settlement out to its radius plus
  # settlementMarginM, and the Haven (difficulty.havenRadiusM around spawn).
  settlementMarginM: 20
  duel:
    challengeRangeM: 30   # challenger and challenged within this distance
    answerS: 20           # the challenge expires unanswered after this
    countdownS: 3         # 3-2-1 after accepting
    ringRadiusM: 25       # around the midpoint of the two at the accept
    outsideForfeitS: 5    # outside the ring longer than this forfeits
    maxS: 180             # the fight is a draw after this
