bosses:
  # Spec 8: 2 or 3 phases, big telegraphed attacks, adds. `at` is the health
  # fraction a phase starts at; a phase change is a short invulnerable roar
  # (transitionMs) that adds a new attack set and summons `adds`.
  warden:
    transitionMs: 2500
    arenaRadius: 26
    phases:
      - {at: 1.0, attacks: [boss_cleave, boss_slam]}
      - {at: 0.66, attacks: [boss_cleave, boss_slam, boss_shockwave], adds: 2, speedMult: 1.1}
      - {at: 0.33, attacks: [boss_cleave, boss_slam, boss_shockwave, boss_charge], adds: 3, speedMult: 1.25, cooldownMult: 0.8}
  archon:
    transitionMs: 2500
    arenaRadius: 26
    phases:
      - {at: 1.0, attacks: [boss_orbs, boss_nova]}
      - {at: 0.6, attacks: [boss_orbs, boss_nova, boss_meteor], adds: 3}
      - {at: 0.3, attacks: [boss_orbs, boss_nova, boss_meteor, boss_beam], adds: 3, cooldownMult: 0.8}
  titles:
    # Boss display name = "<title by element> <name>" ("The Ashen Warden").
    fire: The Ashen
    ice: The Rimebound
    lightning: The Stormwrought
    earth: The Mossbound
    wind: The Galeborn
    light: The Gilded
    dark: The Hollow
    void: The Unmade
    none: The Ancient
  names: {warden: Warden, archon: Archon}

affixes:
  # Spec 8 elites: an element and an affix. Wind-ups never leave 300-600 ms.
  fast: {id: 1, hpMult: 7, damageMult: 1.4, speedMult: 1.4, cooldownMult: 0.75}
  shielded: {id: 2, hpMult: 5, damageMult: 1.4, shieldPct: 0.4, shieldRegenMs: 6000}
  splitting: {id: 3, hpMult: 6, damageMult: 1.3, splitInto: 2, splitHpPct: 0.35}

