# Lodestone combat content (WP13, spec 8; CR 009).
#
# One definition, generated by `npm run gen` into:
#   contracts/ts/src/gen/combat.ts            (client: timelines, FX, HUD, hit detection)
#   server/pkg/combatdefs/combat_gen.json     (zone: validation, damage, enemy AI; embedded)
# The generator normalizes this file (ms -> 60 Hz steps, ids resolved,
# defaults filled), validates it against the spec 8 feel targets and fails
# the build if anything is off. Never hand-edit the generated files.
#
# Timings are milliseconds and are rounded to whole 1/60 s steps (the input
# frame rate both sides simulate at); every light move must start within
# LIGHT_STARTUP_MAX_MS and recover within LIGHT_RECOVERY_MAX_MS, every enemy
# attack must wind up for ENEMY_WINDUP_MIN_MS..ENEMY_WINDUP_MAX_MS
# (constants.yaml, combat group). Distances are meters, angles degrees.
#
# Numeric ids are wire ids (HitClaim.attackId, EntityRecord.typeId) and must
# never be reused for something else; append new entries instead.
#
# Names: every player-facing name of a spell, passive, technique and
# elemental form lives in the `names` table below and nowhere else, so a
# rename is one line here plus `npm run gen`. Names of the four new trees,
# the elemental forms and the new passives are PROPOSALS pending Nicole's
# approval (docs/proposals/spell-names.md); they are listed under `pending`.
# Ported wizard-wars names are unchanged.
version: 5   # v2: WP15 (docs/cr/011-wp15-night-chemistry.md): materials, killsDemons on the Light tree and form, demons
             # v3: playtest 1 (docs/cr/012-progression-difficulty.md): slimes, the beginner table, leveling, discovery-stamped difficulty tiers
             # v4: playtest 2 (docs/cr/019-pvp-duels.md): opt-in PvP and party duels (the pvp block)
             # v5: playtest 2 spell mechanics (docs/cr/020-spell-mechanics.md): the homing, auto (hold to fire),
             #     rain, charge, orbit, detonate and summon spell blocks, spell types summon and orbit, the
             #     summons table, the brand status

elements: [fire, ice, lightning, earth, wind, light, dark, void] # index = worldgen element id; 8 = physical

effectiveness:
  # attacker element -> defender elements it is strong against. Each pair
  # has a reason a player can guess: earth grounds lightning, lightning
  # rides the wind, wind snuffs fire, fire melts ice, ice shatters stone.
  # Light and dark are each other's bane. Void is the rarest gem: a little
  # strong against everything but itself. Every element resists itself.
  strong: 1.5
  resist: 0.5
  voidAll: 1.2
  pairs: {earth: [lightning], lightning: [wind], wind: [fire], fire: [ice], ice: [earth], light: [dark], dark: [light]}

statuses:
  # Applied to ENEMIES only (players take damage, never statuses that would
  # move them outside the shared movement step).
  burn: {id: 1, durationMs: 1500, tickMs: 500, tickDamage: 5, maxStacks: 3}
  slow: {id: 2, durationMs: 2000, speedMult: 0.6}
  freeze: {id: 3, durationMs: 1500, breakOnDamage: true}
  stun: {id: 4, durationMs: 800}
  petrify: {id: 5, durationMs: 2500}
  airborne: {id: 6, durationMs: 1200, damageMult: 1.25}
  curse: {id: 7, durationMs: 4000, damageMult: 1.2}
  shock: {id: 8, durationMs: 1000, damageMult: 1.1}
  pull: {id: 9, durationMs: 600}
  knockback: {id: 10, durationMs: 400}
  taunt: {id: 11, durationMs: 4000}
  black_flame: {id: 12, durationMs: 30000, tickMs: 1000, tickDamage: 8, maxStacks: 1}
  # CR 020: a mark that does nothing by itself; a spell's detonate.onDeath
  # bursts it when the branded enemy dies (the burst can kill other branded
  # enemies: a chain reaction).
  brand: {id: 13, durationMs: 8000}

skills:
  # Spec 8: skills grow by use, 1 to 100; every 10 levels unlocks a
  # technique. xpForLevel(n) = round(xpBase * (n - 1) ^ xpExp), cumulative.
  xpBase: 12
  xpExp: 1.6
  list:
    swordsmanship: {id: 1, techniques: {10: parry_riposte, 20: dash_cut, 30: sword_form, 40: whirlwind}}
    spearmanship: {id: 2, techniques: {10: sweep, 20: pole_vault, 30: spear_form, 40: impale}}
    archery: {id: 3, techniques: {10: quick_draw, 20: double_shot, 30: charged_pierce, 40: arrow_rain}}
    spellcraft: {id: 4, techniques: {10: mana_flow, 20: quick_cast, 30: overflow, 40: twin_cast}}
    mining: {id: 5, techniques: {}}   # WP09 owns mining; the skill track lives here so all six share one table
    smithing: {id: 6, techniques: {}} # WP14 owns forging

weapons:
  # moves: light = primary button; heavy = secondary; charged = release of a
  # held secondary (bow draw, spear charge); sprint/air/plunge variants are
  # picked automatically from movement (spec 8 "mobility in combat").
  # Light startups are 67 ms (4 steps), two steps under LIGHT_STARTUP_MAX_MS:
  # a press waits up to one rendered frame for the next 60 Hz step, and the
  # MEASURED press-to-first-hit-frame time (the client probe) must still be
  # <= 100 ms at 60 fps.
  sword:
    id: 1
    skill: swordsmanship
    spellPower: 1.0
    manaRegen: 1.0
    parryMs: 200          # secondary press opens a parry window this long
    moves:
      sword_slash_1: {id: 101, kind: light, combo: 0, startupMs: 67, activeMs: 100, recoveryMs: 200, damage: 18, reach: 2.6, arc: 110}
      sword_slash_2: {id: 102, kind: light, combo: 1, startupMs: 67, activeMs: 100, recoveryMs: 200, damage: 20, reach: 2.6, arc: 110}
      sword_slash_3: {id: 103, kind: light, combo: 2, startupMs: 67, activeMs: 117, recoveryMs: 250, damage: 30, reach: 2.8, arc: 140}
      sword_sprint: {id: 104, kind: sprint, startupMs: 83, activeMs: 117, recoveryMs: 233, damage: 22, reach: 3.2, arc: 90}
      sword_air: {id: 105, kind: air, startupMs: 67, activeMs: 117, recoveryMs: 200, damage: 20, reach: 2.6, arc: 120}
      sword_plunge: {id: 106, kind: plunge, startupMs: 50, activeMs: 133, recoveryMs: 250, damage: 30, reach: 3.0, arc: 360, perMeter: 3, maxBonus: 60}
      sword_riposte: {id: 107, kind: riposte, startupMs: 50, activeMs: 117, recoveryMs: 200, damage: 45, reach: 3.0, arc: 120}
      sword_whirlwind: {id: 108, kind: heavy, startupMs: 100, activeMs: 250, recoveryMs: 250, damage: 32, reach: 3.0, arc: 360, technique: whirlwind}
  spear:
    id: 2
    skill: spearmanship
    spellPower: 1.0
    manaRegen: 1.0
    moves:
      spear_thrust: {id: 201, kind: light, combo: 0, startupMs: 67, activeMs: 83, recoveryMs: 233, damage: 24, reach: 3.6, arc: 30}
      spear_sweep: {id: 202, kind: light, combo: 1, startupMs: 67, activeMs: 117, recoveryMs: 250, damage: 20, reach: 3.2, arc: 120}
      spear_charged: {id: 203, kind: charged, startupMs: 50, activeMs: 133, recoveryMs: 250, damage: 24, reach: 4.4, arc: 30, chargeMs: 600, chargeMult: 1.8}
      spear_sprint: {id: 204, kind: sprint, startupMs: 83, activeMs: 117, recoveryMs: 250, damage: 26, reach: 4.0, arc: 30}
      spear_air: {id: 205, kind: air, startupMs: 67, activeMs: 117, recoveryMs: 200, damage: 22, reach: 3.4, arc: 60}
      spear_plunge: {id: 206, kind: plunge, startupMs: 50, activeMs: 133, recoveryMs: 250, damage: 32, reach: 3.0, arc: 360, perMeter: 3, maxBonus: 60}
  bow:
    id: 3
    skill: archery
    spellPower: 1.0
    manaRegen: 1.0
    moves:
      # CR 033 (playtest 2 bow rework): the PRIMARY button draws while held
      # (on the wire the alt_attack bit, counted per step exactly like a
      # spear charge) and letting go looses bow_charged; damage and speed
      # (so range) scale linearly with the draw up to chargeMs. A tap still
      # draws for minChargeMs before it looses (a weak shot, never an
      # instant one). The zone refuses a bow shot drawn for less, and the
      # bow_quick light move (kept only so its id still classifies).
      bow_quick: {id: 301, kind: light, startupMs: 67, activeMs: 17, recoveryMs: 200, damage: 14, reach: 45, arc: 0, speed: 45, gravity: 9, radius: 0.25}
      bow_charged: {id: 302, kind: charged, startupMs: 17, activeMs: 17, recoveryMs: 233, damage: 14, reach: 90, arc: 0, speed: 45, gravity: 9, radius: 0.25, chargeMs: 1000, minChargeMs: 150, chargeMult: 2.4, chargeSpeed: 75}
      bow_rain: {id: 303, kind: heavy, startupMs: 100, activeMs: 17, recoveryMs: 250, damage: 12, reach: 30, arc: 0, radius: 4, technique: arrow_rain, hits: 4, cooldownMs: 8000}
    arrows:
      # Data hooks for WP14 (ore arrows, gem tips): damage multiplier by the
      # arrowhead ore; a gem tip gives the arrow its element. Bows have
      # infinite ammo (CR 033): a shot never spends an arrow. Using a stack
      # of arrows (items.yaml ammo) only picks the arrowheads every shot
      # carries from then on (copper by default); the stack is kept.
      copper: {mult: 1.0}
      iron: {mult: 1.15}
      silver: {mult: 1.25, demonStagger: true}
      sunsteel: {mult: 1.35, killsDemons: true}
      starmetal: {mult: 1.5}
      voidglass: {mult: 1.6}
  staff:
    id: 4
    skill: spellcraft
    spellPower: 1.25
    manaRegen: 1.25
    moves:
      staff_bonk: {id: 401, kind: heavy, startupMs: 100, activeMs: 100, recoveryMs: 250, damage: 12, reach: 2.4, arc: 100}
      staff_bolt: {id: 402, kind: light, startupMs: 67, activeMs: 17, recoveryMs: 233, damage: 14, reach: 40, arc: 0, speed: 40, radius: 0.3}
  wand:
    id: 5
    skill: spellcraft
    spellPower: 1.15
    manaRegen: 1.1
    cooldownMult: 0.9
    moves:
      wand_jab: {id: 501, kind: heavy, startupMs: 83, activeMs: 83, recoveryMs: 200, damage: 8, reach: 2.0, arc: 90}
      wand_bolt: {id: 502, kind: light, startupMs: 50, activeMs: 17, recoveryMs: 183, damage: 9, reach: 35, arc: 0, speed: 55, radius: 0.22}

materials:
  # WP15 (CR 011): what a main-hand weapon is made of. A loadout carries the
  # material key of its weapon (Loadout.material in the zone's skill_tree
  # JSON; WP14 sets it from the forged item, e.g. a blade forged from
  # sunsteel ingots -> "sunsteel"). The demon rule reads ONLY killsDemons:
  # a hit kills demons iff its weapon material (or arrowhead, weapons.bow.
  # arrows) has killsDemons, or it is Light magic (trees.light.killsDemons,
  # forms.light.killsDemons). Ids are wire ids (dev Interact 50 action 6).
  iron: {id: 1, mult: 1.0}
  silver: {id: 2, mult: 1.0, demonStagger: true}
  sunsteel: {id: 3, mult: 1.0, killsDemons: true}

forms:
  # Spec 8 elemental forms: weapon techniques powered by the socketed gem's
  # element (swordsmanship/spearmanship 30). Secondary + primary together.
  # Shapes reuse the spell vocabulary below. Names are proposals.
  fire: {id: 601, shape: aoe, selfCast: true, radius: 3.5, damage: 40, status: burn, cooldownMs: 6000, stamina: 20}
  ice: {id: 602, shape: cone, reach: 4, arc: 120, damage: 35, status: freeze, cooldownMs: 6000, stamina: 20}
  lightning: {id: 603, shape: line, reach: 10, width: 1.5, damage: 45, status: shock, chain: 2, cooldownMs: 6000, stamina: 20}
  earth: {id: 604, shape: line, reach: 8, width: 2, damage: 50, status: stun, cooldownMs: 6000, stamina: 20}
  wind: {id: 605, shape: line, reach: 8, width: 2, damage: 40, status: knockback, dash: 9, cooldownMs: 6000, stamina: 20}
  light: {id: 606, shape: cone, reach: 4, arc: 140, damage: 40, demonMult: 2, killsDemons: true, cooldownMs: 6000, stamina: 20}
  dark: {id: 607, shape: cone, reach: 3.5, arc: 90, damage: 40, lifesteal: 0.5, cooldownMs: 6000, stamina: 20}
  void: {id: 608, shape: aoe, selfCast: true, radius: 4, damage: 45, status: pull, cooldownMs: 6000, stamina: 20}

dashes:
  # Movement variants of the shared dodge (InputFrame: dodge flag with
  # castSlot = variant id). Variant 0 is the plain dodge (constants.yaml
  # DODGE_*). The movement step on both sides reads this table, so every
  # value here changes prediction and simulation together. steps and
  # iframes are at most 15 (they ride in 4 bits of SelfState.moveExt).
  #
  # Playtest 2 dash overhaul (docs/cr/021-dash-overhaul.md): every dash is
  # several times sprint speed (sprint = 12.8 m/s) and the mobility spells
  # can be HELD. `aim: look` starts the dash along the 3D look direction
  # (yaw AND pitch: magma dash flies). `exitSpeed` is the horizontal speed a
  # dash keeps when it ends (the carry; default DASH_EXIT_SPEED, at most the
  # zone's walk bound). `sustain` (both movement twins read it): while the
  # dash runs and the frames carry InputFlag.channel with castSlot = this
  # variant (and no attack, dodge or cast), the dash keeps going:
  #   jet    thrust toward the 3D look direction (velocity eases onto
  #          look * speed by `steer` per step, gravity cancelled in the air)
  #   dash   along the held keys (else straight ahead) at `speed`, steered
  #   skate  a dash that treats water as ground (a frozen path)
  #   blink  `speed`, and every `blinkEvery` steps one step at `blinkSpeed`
  #          (chained short teleports)
  #   glide  a dash whose fall is held to `sink` m/s
  #   phase  a dash that keeps the i-frames up
  # Each held step re-arms `carrySteps` of dash, so letting go keeps the
  # velocity that long (the carry) before exitSpeed. The zone pays for every
  # held step (manaPerS, healthPerS: Player.sustainDash) and strips the hold
  # when it cannot (the step then ends the dash on both sides). `trail` is
  # what the dash does to the world (the zone's, no claims): enemies it
  # passes within `radius` take `damage` (once per dash each, `status`,
  # `lifesteal`), `heal` heals you and your party nearby every half second,
  # `chem` schedules ignite/freeze chemistry along the path, `slam` is a dive
  # into the ground (falling faster than minFall m/s) bursting there.
  magma_dash: {id: 1, speed: 30, steps: 12, iframes: 6, lift: 0, aim: look, exitSpeed: 18, sustain: {kind: jet, speed: 36, steer: 0.09, carrySteps: 4, manaPerS: 24}, trail: {radius: 1.8, damage: 14, status: burn, chem: ignite, slam: {minFall: 14, radius: 4.5, damage: 45, status: knockback}}}
  glacier_step: {id: 2, speed: 44, steps: 10, iframes: 8, lift: 0, exitSpeed: 16, sustain: {kind: skate, speed: 30, carrySteps: 4, manaPerS: 16}, trail: {radius: 1.6, damage: 8, status: slow, chem: freeze}}
  phase_slip: {id: 3, speed: 40, steps: 12, iframes: 12, lift: 0, exitSpeed: 16, sustain: {kind: dash, speed: 32, carrySteps: 4, manaPerS: 6, healthPerS: 14}, trail: {radius: 1.8, damage: 12, lifesteal: 0.6}}
  root_launch: {id: 4, speed: 30, steps: 8, iframes: 6, lift: 6, exitSpeed: 14, sustain: {kind: dash, speed: 26, carrySteps: 4, manaPerS: 18}, trail: {radius: 2.0, damage: 16, status: knockback}}
  static_step: {id: 5, speed: 54, steps: 6, iframes: 6, lift: 0, exitSpeed: 16, sustain: {kind: blink, speed: 22, blinkSpeed: 120, blinkEvery: 5, carrySteps: 5, manaPerS: 20}, trail: {radius: 1.8, damage: 10, status: shock}}
  updraft: {id: 6, speed: 18, steps: 6, iframes: 6, lift: 14, exitSpeed: 18, sustain: {kind: glide, speed: 30, sink: 1.0, carrySteps: 4, manaPerS: 12}, trail: {radius: 2.2, damage: 6, status: knockback}}
  sunstep: {id: 7, speed: 46, steps: 10, iframes: 8, lift: 0, exitSpeed: 16, sustain: {kind: dash, speed: 30, carrySteps: 4, manaPerS: 16}, trail: {radius: 1.8, damage: 8, heal: 6, healRadius: 8}}
  skip: {id: 8, speed: 60, steps: 10, iframes: 10, lift: 0, exitSpeed: 18, sustain: {kind: phase, speed: 34, carrySteps: 4, manaPerS: 28}, trail: {radius: 1.8, damage: 10}}
  gale_cut: {id: 9, speed: 40, steps: 15, iframes: 9, lift: 0, exitSpeed: 14}

mana:
