start:
  # What a new character knows and carries (spec 8: two loadouts, weapon in
  # the main hand and up to four spells from the off hand).
  spells: [ember_flick, frost_bite, magma_dash]
  loadouts:
    - {weapon: sword, spells: [ember_flick, frost_bite, magma_dash, null]}
    - {weapon: staff, spells: [ember_flick, frost_bite, magma_dash, null]}
  consumable: {charges: 3, heal: 40}   # healing draught: WP14 replaces it with real items

