bosses:
  # Spec 8: 2 or 3 phases, big telegraphed attacks, adds. `at` is the health
  # fraction a phase starts at; a phase change is a short invulnerable roar
  # (transitionMs) that adds a new attack set and summons `adds`.
  warden:
    transitionMs: 2500
    arenaRadius: 26
    phases:
      - {at: 1.0, attacks: [boss_cleave, boss_slam]}
      - {at: 0.66, attacks: [boss_cleave, boss_slam, boss_shockwave], adds: 2, speedMult: 1.1}
      - {at: 0.33, attacks: [boss_cleave, boss_slam, boss_shockwave, boss_charge], adds: 2, speedMult: 1.2, cooldownMult: 0.9}
  archon:
    transitionMs: 2500
    arenaRadius: 26
    phases:
      - {at: 1.0, attacks: [boss_orbs, boss_nova]}
      - {at: 0.6, attacks: [boss_orbs, boss_nova, boss_meteor], adds: 3}
      - {at: 0.3, attacks: [boss_orbs, boss_nova, boss_meteor, boss_beam], adds: 3, cooldownMult: 0.8}
  vault_keeper:
    # playtest 2 content (CR 022): the sealed vaults' keeper. Phase 2 burns
    # its sigil faster and calls two of the vault's guardians.
    transitionMs: 2000
    arenaRadius: 22
    phases:
      - {at: 1.0, attacks: [keeper_sweep, keeper_sigil]}
      - {at: 0.5, attacks: [keeper_sweep, keeper_sigil, boss_slam], adds: 2, speedMult: 1.15, cooldownMult: 0.8}
  sky_guardian:
    # playtest 3 (CR 044): the sky palaces' guardian. Phase 2 rains sunfall
    # under everyone and calls two sentinels; phase 3 adds the gale and the dive.
    transitionMs: 2000
    arenaRadius: 12
    phases:
      - {at: 1.0, attacks: [guardian_sweep, guardian_lance]}
      - {at: 0.65, attacks: [guardian_sweep, guardian_lance, guardian_sunfall], adds: 2}
      - {at: 0.3, attacks: [guardian_sweep, guardian_lance, guardian_sunfall, guardian_gale, guardian_dive], adds: 2, speedMult: 1.15, cooldownMult: 0.85}
  the_hush:
    # CR 035: the final boss. Phase 2 is the choir (the zone makes it
    # untouchable until its Hollow Bells are shattered), phase 3 the endless
    # night (wells of dawn); the shroud comes in phases 1 and 3.
    transitionMs: 3000
    arenaRadius: 30
    phases:
      - {at: 1.0, attacks: [hush_rend, hush_toll, hush_fall]}
      - {at: 0.7, attacks: [hush_rend, hush_toll, hush_fall], adds: 2}
      - {at: 0.35, attacks: [hush_rend, hush_toll, hush_fall, hush_lance], adds: 2, speedMult: 1.15, cooldownMult: 0.85}
  titles:
    # Boss display name = "<title by element> <name>" ("The Ashen Warden").
    fire: The Ashen
    ice: The Rimebound
    lightning: The Stormwrought
    earth: The Mossbound
    wind: The Galeborn
    light: The Gilded
    dark: The Hollow
    void: The Unmade
    none: The Ancient
  names: {warden: Warden, archon: Archon, vault_keeper: Vault Keeper, sky_guardian: Sky Guardian, the_hush: Hush}

