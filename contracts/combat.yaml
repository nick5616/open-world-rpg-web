  # --- Playtest 2 spell mechanics (CR 020). Generic blocks any spell may carry:
  #   homing:   {turnDegS, acquireM, coneDeg, delayMs, loseDeg} a projectile that flies straight for
  #             delayMs, then locks onto the nearest valid target within acquireM inside a coneDeg cone
  #             around its nose and turns toward it at up to turnDegS; it loses the lock (and flies
  #             straight) when the target falls more than loseDeg off its nose or dies. Simulated in
  #             1/60 s steps by the same function on both sides (spellsim.ts / spellsim.go, golden
  #             vectors); the zone re-flies the path against the target's recorded positions.
  #   auto:     {rateHz, manaPerShot, jitterDeg} hold to fire: the cast starts a stream (one shot every
  #             round(60 / rateHz) steps, at most 15/s) for as long as the cast key is held and mana
  #             lasts; each shot costs manaPerShot (`mana` defaults to it) and leans up to jitterDeg off
  #             the aim by a seeded pattern. The wire carries the stream's start and stop, never a shot.
  #             cooldownMs is the pause after you let go.
  #   rain:     {radius, height} (with auto) each shot falls from `height` m above a seeded point within
  #             `radius` m of the aim point instead of leaving your hand.
  #   charge:   {maxMs, damageMult, radiusMult, speedMult} hold to empower: the cast starts gathering,
  #             the release fires it; damage, explosion radius and speed grow linearly up to maxMs.
  #   orbit:    {count, radius, periodMs, hitEveryMs, orbRadius} (type orbit) `count` orbs circle the
  #             caster at `radius` m for durationMs; each hurts what it touches, one target at most every
  #             hitEveryMs, `hits` times in all.
  #   detonate: {delayMs, radius, damage, status} a hit plants a charge that bursts delayMs later around
  #             the target; or {onDeath: true, mark, radius, damage, status}: a hit brands the target
  #             (statuses.<mark>) and it bursts when it dies (a chain reaction through branded packs).
  #             Bursts are the zone's (no claims) and hurt enemies only.
  #   summon:   {key, count, max} (type summon) calls `count` allies from `summons` for durationMs, at
  #             most `max` of this kind (and SUMMONS_PER_PLAYER of any) at a time: the oldest leaves.
  # Names are proposals until Nicole approves them (pending, docs/proposals/spell-names.md).
  cinder_spray: {id: 1018, tree: fire, tier: 1, type: projectile, damage: 4, cooldownMs: 250, speed: 34, radius: 0.15, range: 18, auto: {rateHz: 12, manaPerShot: 2, jitterDeg: 7}, color: '#ffb347'}
