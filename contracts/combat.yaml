summons:
  # CR 020: allies a summon spell calls (server-side combat bodies owned by the caster, drawn as
  # EntityKind effect with typeId = id | (element + 1) << 8). They fight enemies (and, under the PvP
  # rules only, players the caster may fight), follow the caster, never take damage (apparitions:
  # enemies ignore them) and leave when their time is up, the caster goes down, leaves or runs off
  # beyond leashM. Damage scales like the caster's spells (spell power, spellcraft, level).
  # attack.shape: melee (a bite in reach) | bolt (a projectile at the target; the zone resolves the
  # hit when it would arrive). behavior: melee | ranged (keeps keepAway m) | turret (never moves).
  wraith_hound: {id: 1, family: beast, behavior: melee, element: dark, speed: 9, size: 0.9, color: '#8a5cff', aggro: 18, leashM: 30, attack: {shape: melee, reach: 2.3, damage: 13, everyMs: 1000, windupMs: 250}}
  gale_phantom: {id: 2, family: humanoid, behavior: ranged, element: wind, speed: 7.5, size: 1.0, color: '#9fe8d8', aggro: 24, keepAway: 9, leashM: 30, attack: {shape: bolt, reach: 24, damage: 11, everyMs: 900, windupMs: 200, speed: 36}}
