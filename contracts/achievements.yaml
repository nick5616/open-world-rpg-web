# Achievements (playtest 2, CR 031; docs/cr/031-achievements.md). One table
# for every achievement. The 37 feats of CR 023 and later features (content,
# fishing, pets, instruments) moved here with their keys, stats and counts
# unchanged, so what a character earned and every counter carry over.
#
# Generated by `npm run gen` (contracts/codegen/lib/content.mjs, with
# content.yaml) into contracts/ts/src/gen/content.ts (CONTENT.achievements)
# and server/pkg/contentdefs/content_gen.json (contentdefs.D.Achievements).
# The generator checks every stat and its argument (families, elements,
# dashes, stations, fish, rarities, world event kinds), item rewards
# against items.yaml, chains, and that no count is out of reach.
#
# Fields:
#   name, desc   shown in the Achievements screen (J or Y) and the unlock toast
#   cat          exploration | combat | magic | crafting (Crafting & Gathering) |
#                social | companions (pets, steed) | music | events (World
#                Events & Dungeons) | secrets
#   tier         bronze | silver | gold | platinum (points: 10 / 25 / 50 / 100
#                unless `pts`; gold and platinum unlocks are announced to your
#                party and players near you)
#   stat, n      earned when the counter reaches n (progress bar n > 1)
#   gold, xp     paid on unlock (default by tier: 10/50, 40/200, 120/600, 300/1500)
#   title        optional nameplate title (choose it in the Achievements screen
#                or the character panel)
#   item, qty    optional item reward (items.yaml key)
#   hidden       shown as "???" (with `hint`, if any) until earned
#   chain        steps of one chain share a key; shown as I / II / III in count order
#
# Stats (the zone's counters, persisted per character in character_content):
#   towers (crystals attuned), regions (walked in), vaultsfound, tablets,
#   codex (creatures in the bestiary), level, nights (seen through from dusk
#   to dawn), lightning (struck and lived), lightningmetal (a bolt your own
#   metal weapon drew, and lived), deaths (went down),
#   kills (non-demon), demons, family:<combat family>, killel:<element>,
#   duels (won), pvpkills (players downed in open PvP),
#   casts, cast:<element> (spells cast per school), schools (schools cast),
#   dashes (dashes started), dashm:<dash key> (metres dashed), flight
#   (seconds of magma jet flight more than 6 m above the ground), flighthigh
#   (highest metres above the ground on a magma jet), magmaflight (flights:
#   a held magma jet more than 6 m up for over 2 s), slams (magma dives),
#   forage (herbs), mined (ore veins broken), crafted, craft:<forge | cook |
#   workbench | camp>, fish, fish:<species>, fishspecies, fishlegend, gold
#   (earned), loot:<rarity> (items found),
#   side, stories, honored (towns at the top tier), bounties, emotes,
#   tamed, tamedspecies, shinytamed, petlevel, petted, gallop (metres ridden),
#   notes, songs, ovations, firesongs,
#   events (world events won), event:<kind>, eventkinds, dungeons (vaults cleared).
