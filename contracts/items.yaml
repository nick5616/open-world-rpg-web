# What a new character carries (spec 8's consumables replace WP13's
# stand-in draught; granted once per character, exactly once). Playtest 2:
# a pickaxe, because the starter quest's second step is "mine sunsteel ore"
# (characters made before it get one once on join, marker starter:pickaxe).
starter: {potion:health: 3, currency:gold: 20, tool:pickaxe: 1}

# Loot tables (rolled by the zone per eligible player, spec 8 personal loot).
loot:
  # Coins per kill: [min, max] x (1 + perLevel x (level - 1)).
  coins: {common: [2, 6], elite: [12, 26], boss: [80, 140], perLevel: 0.15}
  # Chance per kill of each extra drop, by enemy family (combat.yaml).
  families:
    beast: {item: 0.12, meat: 0.6, hide: 0.35, gem: 0.03, blueprint: 0.02, consumable: 0.05}
    bandit: {item: 0.35, gem: 0.04, blueprint: 0.05, consumable: 0.15, food: 0.2}
    guardian: {item: 0.3, gem: 0.12, blueprint: 0.08, consumable: 0.05}
    elemental: {item: 0.2, gem: 0.18, blueprint: 0.03, consumable: 0.05}
    cave: {item: 0.2, gem: 0.15, ore: 0.4, blueprint: 0.04, consumable: 0.05}
    boss: {item: 1.0, gem: 1.0, blueprint: 1.0, consumable: 1.0}
    slime: {item: 0.06, consumable: 0.12, food: 0.15}  # playtest 1 (CR 012): Haven beginners
    # playtest 2 content (CR 022): world-event creatures (the event itself pays the real reward)
    critter: {gem: 0.5}
    hunt: {item: 0.25, hide: 0.3, consumable: 0.05}
  # Elites: one guaranteed equipment roll with this luck. Bosses: `items`
  # equipment rolls, a tome, and luck; weekly lockout per character (spec 8).
  elite: {items: 1, luck: 2.0}
  boss: {items: 3, luck: 4.0, tomes: 1, lockoutDays: 7}
  # Containers (worldgen chunk containers: kind 0 chest, 1 buried cache,
  # 2 urn, 3 crate). Opened once per character (spec 8).
  containers:
    chest: {coins: [8, 20], items: [1, 2], luck: 1.5, gem: 0.25, blueprint: 0.15, consumable: 0.4}
    buried_cache: {coins: [15, 40], items: [1, 1], luck: 2.0, gem: 0.35, blueprint: 0.2, consumable: 0.2}
    urn: {coins: [3, 10], items: [0, 1], luck: 1.0, gem: 0.15, blueprint: 0.05, consumable: 0.3}
    crate: {coins: [0, 6], items: [0, 1], luck: 1.0, gem: 0.05, blueprint: 0.05, consumable: 0.6}
  # Socket count weights for rolled weapons (spec 8: 0 to 3), shifted one
  # step up from relic upward.
  sockets: [0.5, 0.3, 0.15, 0.05]
  # Opal loot find: each point of lootFindPct adds 1 % to the luck multiplier.
  # Depth: deep-cave sources (WP09 depth band 2) add this luck.
  deepCaveLuck: 2.0
