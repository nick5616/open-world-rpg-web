# Items, rarities, affixes, recipes and loot tables (WP14, docs/cr/010-loot.md).
#
# One table for the zone (server/pkg/itemdefs, embedded JSON) and the client
# (contracts/ts/src/gen/items.ts): `npm run gen` normalizes this file, so the
# two can never disagree about what an item is, what a recipe costs or how
# likely a Bitchin' roll is. The generator (contracts/codegen/lib/items.mjs)
# validates every reference (recipe inputs, blueprint outputs, merchant
# items) and expands the families (gems x cuts, ores, ingots, blueprints).
#
# ITEM KEYS ARE A CONTRACT. They are stored in items.base_id, carried on the
# wire (pickup entity names, Event 400 inventory, WP20 shop lists) and read
# by other packages: WP15 checks `killsDemons` on the equipped weapon's
# material (weapon:sunsteel_blade, ammo:sunsteel_arrow). Renaming a key
# orphans every stored item with it; add, never rename.
#
# Key shape: <category>:<name>[:<variant>], e.g. ore:iron, gem:ruby:cut,
# weapon:sunsteel_blade, food:stew, tome:fireball. WP09's mining drops
# (ore:<name>, gem:<name>:<cut>) and WP20's placeholder shop ids already
# follow it.
version: 1

# Spec 8 rarity table. `odds` are per roll at the base; luck (item level,
# source, Opal) multiplies the odds of rare and above (`lucky: true`), and
# common absorbs whatever is left so the eight always sum to 1. Bitchin' is
# "anywhere, about 1 in a million" and never shifted by luck (spec: its
# odds are a fixed property of a roll, not of the source).
rarities:
  - {key: common, name: Common, color: '#9d9d9d', affixes: 0, uniques: 0, odds: 0.60}
  - {key: uncommon, name: Uncommon, color: '#3ec93e', affixes: 1, uniques: 0, odds: 0.25}
  - {key: rare, name: Rare, color: '#3d8bff', affixes: 2, uniques: 0, odds: 0.10, lucky: true}
  - {key: relic, name: Relic, color: '#a64dff', affixes: 3, uniques: 0, odds: 0.04, lucky: true}
  - {key: legendary, name: Legendary, color: '#ff8c1a', affixes: 3, uniques: 1, odds: 0.009, lucky: true}
  - {key: mythic, name: Mythic Artifact, color: '#e8323c', affixes: 4, uniques: 1, named: true, odds: 0.0009, lucky: true}
  - {key: primordial, name: Primordial, color: '#f3dc9a', affixes: 5, uniques: 1, named: true, odds: 0.00009, lucky: true, bases: [starmetal, voidglass]}
  - {key: bitchin, name: "Bitchin'", color: holographic, affixes: 5, uniques: 2, named: true, odds: 0.000001, announce: true}

# Luck caps: the shifted odds of rare-and-above never exceed this share of
# all rolls (a stack of luck sources must not turn every roll purple).
luckCap: 0.6

# Weapon and armor materials. `mult` scales weapon damage and armor stats;
# `killsDemons` / `demonStagger` are WP15's rule data (spec 8: only sunsteel
# kills demons; silver staggers them longer).
materials:
  wood: {name: Oak, mult: 1.0, tier: 1}
  leather: {name: Leather, mult: 1.0, tier: 1}
  copper: {name: Copper, mult: 0.9, tier: 1}
  iron: {name: Iron, mult: 1.0, tier: 2}
  silver: {name: Silver, mult: 1.1, tier: 3, demonStagger: true}
  sunsteel: {name: Sunsteel, mult: 1.2, tier: 4, killsDemons: true}
  starmetal: {name: Starmetal, mult: 1.35, tier: 5}
  voidglass: {name: Voidglass, mult: 1.5, tier: 6}
  # playtest 2 visible armor (CR 034): woven armor (hoods, robes). Appended, so material
  # codes (1 + index: the weapon look, the avatar appearance) never move.
  cloth: {name: Cloth, mult: 0.8, tier: 1}

# The eight elements' gems plus the two utility gems (spec 7). `element`
# is the worldgen/combat element index (0 fire .. 7 void), -1 utility.
# Socketed in a weapon, an elemental gem powers the WP13 elemental form of
# its element; Opal adds loot find; Moonstone adds stamina (data for the
# shared movement step: not applied in v1, see STATUS) and night sight (WP15).
gems:
  ruby: {name: Ruby, element: 0}
  sapphire: {name: Sapphire, element: 1}
  topaz: {name: Topaz, element: 2}
  emerald: {name: Emerald, element: 3}
  aquamarine: {name: Aquamarine, element: 4}
  sunstone: {name: Sunstone, element: 5}
  onyx: {name: Onyx, element: 6}
  amethyst: {name: Amethyst, element: 7}
  opal: {name: Opal, element: -1, stat: lootFindPct}
  moonstone: {name: Moonstone, element: -1, stat: staminaPct}

# Spec 7: rough, cut, brilliant; three of a cut combine into the next at a
# waypoint. `formMult` scales the elemental form's damage, `utility` is the
# Opal/Moonstone stat value, `value` the merchant price hint.
cuts:
  - {key: rough, name: Rough, formMult: 1.0, utility: 4, value: 10}
  - {key: cut, name: Cut, formMult: 1.25, utility: 8, value: 35}
  - {key: brilliant, name: Brilliant, formMult: 1.5, utility: 14, value: 120}
combineCount: 3

# Ores (spec 7 table) smelt into ingots of the same metal.
ores:
  copper: {name: Copper, smelt: 2}
  iron: {name: Iron, smelt: 2}
  silver: {name: Silver, smelt: 2}
  sunsteel: {name: Sunsteel, smelt: 2}
  starmetal: {name: Starmetal, smelt: 3}
  voidglass: {name: Voidglass, smelt: 3}

# Stacks: how many fit in one stack per category (1 = never stacks).
stacks: {ore: 99, ingot: 99, gem: 99, food: 20, potion: 20, meat: 20, herb: 40, hide: 20, ammo: 99, tool: 1, seed: 20, blueprint: 1, tome: 1, currency: 1000000, weapon: 1, armor: 1, key: 1, quest: 10, wood: 50, camp: 5, fish: 20, instrument: 1}

# Where a category lives (spec 8: 40 slots plus a gem pouch and an ore pouch;
# coins in a purse that takes no slot).
pouches: {gem: gem, ore: ore, ingot: ore, currency: purse}

