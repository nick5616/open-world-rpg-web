# Spell tomes: `tome:<spell key>` for every castable spell in combat.yaml
# (resolved at runtime against combatdefs, so a new spell is a new tome
# with no change here). Using one learns the spell (combat Profile.Grant).
tome: {name: 'Tome: {spell}', value: 150}

# Elemental and stat affixes (spec 8: "tables keyed by element and loot
# theme"). Weight is the base chance; an affix that names elements/themes
# is x4 on a matching roll and x0.25 off it. Values are rolled in
# [min, max] and scaled by +3 % per item level above 1. Stats: damagePct,
# critPct, spellPowerPct (weapons), health, armorPct (armor), lootFindPct
# (any). All are applied by the zone (server/zone/internal/items gear.go).
affixes:
  brutal: {name: Brutal, stat: damagePct, min: 4, max: 10, slots: [weapon], weight: 10}
  keen: {name: Keen, stat: critPct, min: 2, max: 5, slots: [weapon], weight: 8}
  arcane: {name: Arcane, stat: spellPowerPct, min: 4, max: 10, slots: [weapon], weight: 6, themes: [arcane, celestial, voidtouched]}
  of_embers: {name: of Embers, stat: damagePct, min: 6, max: 14, slots: [weapon], weight: 4, elements: [0], themes: [infernal, draconic]}
  of_frost: {name: of Frost, stat: damagePct, min: 6, max: 14, slots: [weapon], weight: 4, elements: [1], themes: [drowned, royal]}
  of_storms: {name: of Storms, stat: critPct, min: 3, max: 7, slots: [weapon], weight: 4, elements: [2], themes: [celestial]}
  of_stone: {name: of Stone, stat: armorPct, min: 2, max: 6, slots: [weapon, armor], weight: 4, elements: [3], themes: [ancient, rustic]}
  of_gales: {name: of Gales, stat: critPct, min: 3, max: 7, slots: [weapon], weight: 4, elements: [4], themes: [sylvan, feral]}
  of_dawn: {name: of Dawn, stat: spellPowerPct, min: 6, max: 14, slots: [weapon], weight: 4, elements: [5], themes: [celestial, royal]}
  of_dusk: {name: of Dusk, stat: damagePct, min: 6, max: 14, slots: [weapon], weight: 4, elements: [6], themes: [bandit, infernal]}
  of_the_void: {name: of the Void, stat: spellPowerPct, min: 8, max: 16, slots: [weapon], weight: 2, elements: [7], themes: [voidtouched]}
  sturdy: {name: Sturdy, stat: health, min: 5, max: 15, slots: [armor], weight: 10}
  warding: {name: Warding, stat: armorPct, min: 2, max: 5, slots: [armor], weight: 8, themes: [royal, ancient]}
  hale: {name: Hale, stat: health, min: 8, max: 20, slots: [armor], weight: 4, themes: [rustic, sylvan, feral]}
  lucky: {name: Lucky, stat: lootFindPct, min: 2, max: 6, slots: [weapon, armor], weight: 3, themes: [bandit, royal, drowned]}

# Unique effects (legendary and above: spec 8 "a unique effect", Bitchin'
# two). Each is a bundle of the same stats, larger than any affix, with a
# name shown on the item.
uniques:
  emberheart: {name: Emberheart, stats: {damagePct: 20, critPct: 4}}
  stormcall: {name: Stormcall, stats: {critPct: 10}}
  oathkeeper: {name: Oathkeeper, stats: {armorPct: 8, health: 30}}
  starlit: {name: Starlit, stats: {spellPowerPct: 25}}
  gravebloom: {name: Gravebloom, stats: {damagePct: 12, health: 20}}
  magpie: {name: "Magpie's Eye", stats: {lootFindPct: 15}}
  sunforged: {name: Sunforged, stats: {damagePct: 15, spellPowerPct: 15}}
  hollowstep: {name: Hollowstep, stats: {critPct: 6, armorPct: 5}}

# Named uniques (mythic and above): "<first><second>" from these lists, by
# the roll seed. Original words, no names from other games.
names:
  first: [Dawn, Ash, Gale, Thorn, Ember, Frost, Hollow, Star, Grave, Storm, Sun, Rift, Iron, Moon, Wild, Bright]
  second: [breaker, song, fall, warden, bite, heart, reaver, call, mourn, spire, keeper, wake, fang, crown, edge, light]

# Recipes. station: forge (town forge or anvil: smelting and forging),
# cook (inn hearth or campfire: cooking). A forge recipe with a blueprint
# needs the blueprint item in the inventory (it is not consumed: spec 8
# blueprints are "found in structures or bought from blacksmiths" and teach
# the pattern); copper gear and smelting need none. `sockets` is the
# guaranteed socket count of a forged item (more can roll, up to the base's
# max); `luck` the rarity luck of the forge roll, +1 % per Smithing level.
recipes:
  smelt_copper: {station: forge, inputs: {ore:copper: 2}, output: ingot:copper, xp: 8}
  smelt_iron: {station: forge, inputs: {ore:iron: 2}, output: ingot:iron, xp: 10}
  smelt_silver: {station: forge, inputs: {ore:silver: 2}, output: ingot:silver, xp: 14}
  smelt_sunsteel: {station: forge, inputs: {ore:sunsteel: 2}, output: ingot:sunsteel, xp: 20}
