# Shared constants: the single source for TS (client, tools), Go (zone, social,
# director, bots) and Rust (worldgen). `npm run gen` regenerates:
#   contracts/ts/src/constants.ts
#   server/pkg/constants/constants.go
#   worldgen/src/gen/constants.rs
#
# Each entry: NAME: {type, value, doc}. Types: f64, i32, u32, string.
# Changing a value that the generator reads (world.*) changes world output and
# therefore needs a new genVersion (spec section 5). Changing a movement value
# changes client prediction AND server simulation together, which is the point
# of keeping them here.
version: 5   # v5: fire spread tuned down (docs/cr/016-fire-spread.md); v4: WP15 night, demons and chemistry (docs/cr/011-wp15-night-chemistry.md)

groups:
  world:
    CHUNK_SIZE_M: {type: i32, value: 64, doc: "Chunk edge length in meters (spec 5)."}
    CHUNK_SAMPLES: {type: i32, value: 65, doc: "Height samples per chunk edge at LOD 0 (1 m spacing, shared edge)."}
    REGION_CHUNKS: {type: i32, value: 16, doc: "Chunks per region edge (16 x 64 m = 1024 m)."}
    WORLD_REGIONS: {type: i32, value: 4, doc: "Regions per world edge in v1 (4 x 1024 m = 4096 m)."}
    WORLD_SIZE_M: {type: i32, value: 4096, doc: "World edge length in meters. World spans [0, WORLD_SIZE_M) on x and z."}
    WORLD_MIN_Y: {type: f64, value: -256, doc: "Deepest cave floor."}
    WORLD_MAX_Y: {type: f64, value: 768, doc: "Highest possible peak."}
    MACRO_RES_M: {type: i32, value: 32, doc: "Atlas macro heightmap resolution in meters."}
    CAVE_CELL_HEIGHT_M: {type: i32, value: 32, doc: "Vertical size of a cave volume cell."}
    CAVE_SAMPLE_M: {type: i32, value: 2, doc: "Cave density sample spacing (33 x 33 x 17 samples per cell)."}
    MATERIAL_GRID_M: {type: i32, value: 2, doc: "Chemistry material grid resolution (spec 8)."}

  sim:
    TICK_RATE_HZ: {type: i32, value: 30, doc: "Zone simulation rate (spec 9). 30 Hz, not wizard-wars' 64: no PvP, so we trade precision for scale."}
    MOVE_STEP_HZ: {type: i32, value: 60, doc: "Client input sample rate. Each input frame is one fixed 1/60 s movement step on both client and server, so the server applies two frames per 30 Hz tick and prediction replays walk the exact same path."}
    INPUT_SEND_HZ: {type: i32, value: 30, doc: "Input packets per second."}
    INPUT_REDUNDANCY: {type: i32, value: 3, doc: "Input frames carried per packet (newest plus repeats) so one lost datagram costs nothing."}
    BASELINE_RING: {type: i32, value: 32, doc: "Per-client ring of acknowledged snapshot baselines for delta encoding."}
    HIT_HISTORY_MS: {type: i32, value: 250, doc: "Lenient PvE hit validation window (spec 9)."}
    SAVE_INTERVAL_S: {type: i32, value: 30, doc: "Character checkpoint interval."}

  movement:
    # Ported from wizard-wars shared/constants.js (movement block). The feel is
    # tuned there; do not retune casually. Those values assumed a 64 Hz step;
    # at our 60 Hz step the per-step deltas differ by ~6%, which is below what
    # testers noticed when we compared side by side (WP02 evidence).
    BASE_MOVE_SPEED: {type: f64, value: 8, doc: "m/s walking."}
    SPRINT_MULTIPLIER: {type: f64, value: 1.6, doc: "Sprint speed = BASE_MOVE_SPEED * this."}
    JUMP_FORCE: {type: f64, value: 6, doc: "Initial vertical velocity of a jump, m/s."}
    GRAVITY: {type: f64, value: -18, doc: "m/s^2."}
    GROUND_ACCEL: {type: f64, value: 5.5, doc: "Source sv_accelerate."}
    AIR_ACCEL: {type: f64, value: 12, doc: "Source sv_airaccelerate; with AIR_CAP_SPEED enables strafe acceleration."}
    GROUND_FRICTION: {type: f64, value: 9, doc: "Higher than Source's 4: stock felt like ice under real tick jitter (wizard-wars)."}
    STOP_SPEED: {type: f64, value: 2.5, doc: "Below this, friction acts as if at this speed so players actually stop."}
    AIR_CAP_SPEED: {type: f64, value: 1, doc: "Wishspeed clamp for air acceleration."}
    MAX_AIR_JUMPS: {type: i32, value: 1, doc: "Double jump."}
    PLAYER_HEIGHT: {type: f64, value: 1.8, doc: "Eye height above feet, m."}
    PLAYER_CAPSULE_RADIUS: {type: f64, value: 0.4, doc: "m."}
    GROUND_SNAP_M: {type: f64, value: 0.3, doc: "Descending within this of the ground snaps to it (ramp descent without stutter)."}
    MAX_STEP_UP_M: {type: f64, value: 0.6, doc: "Height difference walked over without a jump."}
    WALKABLE_SLOPE_DEG: {type: f64, value: 50, doc: "Steeper than this you slide or climb (spec 8: climb 50 to 89 degrees)."}
    CLIMB_MAX_SLOPE_DEG: {type: f64, value: 89, doc: "Upper bound of climbable surfaces."}
    CLIMB_SPEED: {type: f64, value: 2, doc: "m/s."}
    CLIMB_RAIN_MULT: {type: f64, value: 0.5, doc: "Rain halves climb speed."}
    CLIMB_JUMP_STAMINA: {type: f64, value: 20, doc: "Stamina cost of a climb-jump lunge."}
    GLIDE_MIN_FALL_M: {type: f64, value: 1.5, doc: "Minimum height above ground to open the glider."}
    GLIDE_SINK_SPEED: {type: f64, value: 2, doc: "m/s downward while gliding."}
    GLIDE_SPEED: {type: f64, value: 9, doc: "m/s horizontal while gliding."}
    SWIM_SPEED: {type: f64, value: 3, doc: "m/s at the surface."}
    STAMINA_MAX: {type: f64, value: 100, doc: "Starting stamina wheel size."}
    STAMINA_REGEN_DELAY_S: {type: f64, value: 1, doc: "Seconds on ground before stamina refills."}
    STAMINA_REGEN_PER_S: {type: f64, value: 40, doc: "Refill rate."}
    STAMINA_SPRINT_PER_S: {type: f64, value: 12, doc: "Drain while sprinting."}
    STAMINA_CLIMB_PER_S: {type: f64, value: 10, doc: "Drain while climbing."}
    STAMINA_GLIDE_PER_S: {type: f64, value: 6, doc: "Drain while gliding."}
    STAMINA_SWIM_PER_S: {type: f64, value: 8, doc: "Drain while swimming."}
    # ---- WP10 (CR 004): climb / glide / swim / slope tuning. Every value
    # below feeds the shared step in client/src/sim/movement.ts and
    # server/pkg/movement; the algorithm is in client/src/sim/README.md.
    WALKABLE_TAN_SQ: {type: f64, value: 1.4202766254612063, doc: "tan(WALKABLE_SLOPE_DEG)^2 as a literal, so TS and Go compare slopes against the identical double (Math.tan and Go's math.Tan may differ in the last ulp). Tests on both sides check it against the degrees."}
    CLIMB_MAX_TAN_SQ: {type: f64, value: 3282.139703653939, doc: "tan(CLIMB_MAX_SLOPE_DEG)^2 as a literal (see WALKABLE_TAN_SQ)."}
    SLOPE_PROBE_M: {type: f64, value: 0.5, doc: "Slope = central differences of the ground height at +-this, i.e. over 1 m: smooths single 1 m triangles of the collision mesh so one odd triangle never decides walk vs climb."}
    STEP_PROBE_M: {type: f64, value: 0.8, doc: "Step-up probe: an uphill move onto steep ground is still allowed when the ground this far ahead is walkable and at most MAX_STEP_UP_M above the feet (a lip, not a wall)."}
    CLIMB_FACING_MIN: {type: f64, value: 0.5, doc: "Holding 'into' a wall: wish direction . uphill direction must be at least this (within 60 degrees) to start climbing."}
    CLIMB_JUMP_SPEED: {type: f64, value: 8, doc: "Climb-jump lunge speed up the wall, m/s along the surface."}
    CLIMB_JUMP_TIME_S: {type: f64, value: 0.25, doc: "Lunge duration (15 steps: 2 m up the wall)."}
    CLIMB_KICK_SPEED: {type: f64, value: 5, doc: "Jump while holding back on a wall: leap away horizontally at this speed (plus JUMP_FORCE up). Free: it ends the climb."}
    CLIMB_SLIP_PERIOD_S: {type: f64, value: 3, doc: "In rain a climber slips once per this period (spec 8: every few seconds)."}
    CLIMB_SLIP_TIME_S: {type: f64, value: 0.5, doc: "Length of one rain slip; input is ignored meanwhile."}
    CLIMB_SLIP_SPEED: {type: f64, value: 3, doc: "Slide-back speed down the wall during a slip, m/s along the surface."}
    MANTLE_SPEED: {type: f64, value: 3, doc: "Forward push when a climb tops out onto walkable ground (the mantle)."}
    SLIDE_MAX_SPEED: {type: f64, value: 12, doc: "Speed cap when sliding down slopes steeper than walkable (no friction there)."}
    GLIDE_ACCEL: {type: f64, value: 6, doc: "Horizontal acceleration toward the steered glide velocity, m/s^2."}
    GLIDE_VERTICAL_ACCEL: {type: f64, value: 20, doc: "How fast vertical speed approaches -GLIDE_SINK_SPEED (+ updraft lift) once the glider opens, m/s^2: the canopy catch."}
    UPDRAFT_MAX_LIFT: {type: f64, value: 10, doc: "Upper bound of an updraft column's lift (m/s); the step clamps to it and the zone's vertical validation relies on it."}
    SWIM_ACCEL: {type: f64, value: 6, doc: "Horizontal acceleration toward the swim velocity, m/s^2."}
    SWIM_DEPTH_M: {type: f64, value: 1.5, doc: "Water deeper than this (surface minus ground) is swum, shallower is walked."}
    SWIM_FLOAT_DEPTH_M: {type: f64, value: 1.4, doc: "Swimmers float with their feet this far below the surface (eyes 0.4 m above it)."}
    DROWN_TIME_S: {type: f64, value: 1.5, doc: "Out of stamina in deep water: this long helpless, then respawn at the nearest shore."}
    SHORE_SEARCH_M: {type: f64, value: 256, doc: "Drowning respawn searches for dry walkable ground up to this far (swim drain caps how far from shore you can be)."}
    STAMINA_FINE_PER_POINT: {type: i32, value: 60, doc: "Stamina is integer 'fine' units in the step (SelfState.moveExt), = MOVE_STEP_HZ, so whole per-second rates are whole units per step and the wire carries stamina exactly."}

  aoi:
    AOI_CELL_M: {type: i32, value: 32, doc: "Interest grid cell size."}
    RING_NEAR_M: {type: f64, value: 64, doc: "Near ring outer radius."}
    RING_MID_M: {type: f64, value: 200, doc: "Mid ring outer radius."}
    RING_FAR_M: {type: f64, value: 600, doc: "Far ring outer radius; nothing beyond."}
    RATE_NEAR_HZ: {type: i32, value: 30, doc: "Near ring update rate."}
    RATE_MID_HZ: {type: i32, value: 10, doc: "Mid ring update rate."}
    RATE_FAR_HZ: {type: i32, value: 2, doc: "Far ring update rate."}
    RATE_PARTY_HZ: {type: i32, value: 2, doc: "Party members at any distance."}
    INTERP_DELAY_NEAR_MS: {type: i32, value: 100, doc: "Remote render delay, near ring (wizard-wars default)."}
    INTERP_DELAY_MID_MS: {type: i32, value: 200, doc: "Mid ring: 10 Hz needs ~2 samples of buffer."}
    INTERP_DELAY_FAR_MS: {type: i32, value: 1000, doc: "Far ring: 2 Hz needs ~2 samples of buffer."}
    GHOST_BAND_M: {type: f64, value: 64, doc: "Region border strip mirrored to the neighbor zone."}
    ENEMY_WAKE_M: {type: f64, value: 96, doc: "Enemies sleep until a player is this close."}

  combat:
    # ---- WP13 (CR 009): spec 8 "Combat feel" targets and the shared dodge.
    # The feel numbers are acceptance criteria (docs/evidence/wp13-feel.md);
    # tests on both sides check every weapon move and enemy attack in
    # contracts/combat.yaml against them. Dodge values feed the shared
    # movement step (client/src/sim/movement.ts, server/pkg/movement), so they
    # change prediction and simulation together.
    LIGHT_STARTUP_MAX_MS: {type: i32, value: 100, doc: "Spec 8: light attack startup (press to first active frame) at most this."}
    LIGHT_RECOVERY_MAX_MS: {type: i32, value: 250, doc: "Spec 8: recovery after a light attack's hit frames at most this; a dodge cancels it."}
    INPUT_BUFFER_MS: {type: i32, value: 150, doc: "Spec 8: presses during an animation are buffered this long and fire as soon as the move allows."}
    HITSTOP_MS: {type: i32, value: 60, doc: "Spec 8 (40-80 ms): local-only freeze of the weapon and the struck enemy on a predicted hit. Never pauses the world."}
    CONSUMABLE_USE_MS: {type: i32, value: 300, doc: "Spec 8 (at most 400 ms): time from the use step to the effect on the zone; press-to-effect adds a step, a tick and the event (measured ~330-360 ms). Movement is unaffected meanwhile."}
    ENEMY_WINDUP_MIN_MS: {type: i32, value: 300, doc: "Spec 8: every enemy attack telegraphs at least this long."}
    ENEMY_WINDUP_MAX_MS: {type: i32, value: 600, doc: "Spec 8: and never longer than this."}
    DODGE_IFRAME_STEPS: {type: i32, value: 9, doc: "Spec 8: 150 ms of invulnerability (9 steps at 60 Hz) from the dodge's first step."}
    DODGE_DASH_STEPS: {type: i32, value: 12, doc: "The plain dodge carries the player at DODGE_SPEED for this many steps (0.2 s, 2.4 m)."}
    DODGE_SPEED: {type: f64, value: 12, doc: "Plain dodge dash speed, m/s (horizontal, held constant during the dash: no friction, no steering)."}
    DODGE_STAMINA: {type: f64, value: 12, doc: "Stamina cost of a plain dodge (points). Exhausted players cannot dodge."}
    DASH_EXIT_SPEED: {type: f64, value: 6, doc: "When a dash ends its horizontal speed is clamped to this, so blinks and lunges stop crisply instead of sliding on friction."}
    HIT_RANGE_SLACK_M: {type: f64, value: 1, doc: "Lenient PvE validation (spec 9): a claimed hit may be this much beyond the move's reach at the best sample of the target's last HIT_HISTORY_MS."}
    SUMMONS_PER_PLAYER: {type: i32, value: 3, doc: "CR 020: allies (summon spells) one player may have at once; a new one past the cap sends the oldest away."}
    AUTO_MAX_RATE_HZ: {type: i32, value: 15, doc: "CR 020: the fastest hold-to-fire stream (shots per second); combat.yaml auto.rateHz may not exceed it and the zone never fires faster."}
    HIT_GRACE_MS: {type: i32, value: 200, doc: "Favor the player: an enemy strike on a player settles only after the player's input frames up to this long after the strike; a dodge (i-frames) or being outside the area in any of them evades it."}
    PARTY_SCALE_MAX: {type: i32, value: 8, doc: "Players counted for enemy scaling at most (party size 4 is the tuning point; spec 16)."}
    PARTY_HP_PER_PLAYER: {type: f64, value: 0.75, doc: "Enemy health multiplier per extra engaged player: 1 + 0.75 (n - 1); 4 players = 3.25x."}
    PARTY_DMG_PER_PLAYER: {type: f64, value: 0.1, doc: "Enemy damage multiplier per extra engaged player: 1 + 0.10 (n - 1)."}
    PLAYER_RESPAWN_S: {type: f64, value: 3, doc: "Downed players respawn at their last waypoint (RespawnPoint) after this long, keeping everything (spec 8)."}
    PLAYER_REGEN_DELAY_S: {type: f64, value: 6, doc: "Health regenerates only after this long without taking damage."}
    PLAYER_REGEN_PER_S: {type: f64, value: 4, doc: "Out-of-combat health regeneration, points per second."}
    ENEMY_LEASH_M: {type: f64, value: 40, doc: "Enemies give up a chase this far from home and return (camps, packs); bosses stay in their arena."}
    ENEMY_SPAWN_M: {type: f64, value: 160, doc: "Camps and packs spawn when a player comes this close to their anchor."}
    ENEMY_DESPAWN_M: {type: f64, value: 260, doc: "Spawned groups with no player this close for ENEMY_DESPAWN_S despawn (state is regenerated on return)."}
    ENEMY_DESPAWN_S: {type: f64, value: 30, doc: "See ENEMY_DESPAWN_M."}
    CAMP_RESPAWN_S: {type: f64, value: 600, doc: "A cleared camp or pack comes back after this long."}
    BOSS_RESPAWN_S: {type: f64, value: 3600, doc: "Spec 8: a boss respawns 1 real hour after a kill so others get their turn."}

  voice:
    EARSHOT_OPEN_M: {type: f64, value: 40, doc: "Join radius in open air."}
    EARSHOT_CAVE_M: {type: f64, value: 30, doc: "Join radius in the same cave system."}
    EARSHOT_LEAVE_M: {type: f64, value: 48, doc: "Leave radius (hysteresis so subscriptions don't flap)."}
    EARSHOT_MAX: {type: i32, value: 12, doc: "Nearest speakers subscribed at most."}
    EARSHOT_INTERVAL_MS: {type: i32, value: 250, doc: "Earshot recompute period."}
    VOICE_REF_DISTANCE_M: {type: f64, value: 2, doc: "PannerNode refDistance."}
    VOICE_MAX_DISTANCE_M: {type: f64, value: 40, doc: "PannerNode maxDistance."}

  social:
    CHAT_MAX_LEN: {type: i32, value: 280, doc: "Characters per message."}
    LOCAL_CHAT_RADIUS_M: {type: f64, value: 30, doc: "Local channel radius."}
    CHAT_BUBBLE_MS: {type: i32, value: 6000, doc: "Speech bubble lifetime."}
    GLOBAL_SLOW_MODE_MS: {type: i32, value: 10000, doc: "One global message per 10 s per player."}
    HISTORY_GLOBAL: {type: i32, value: 200, doc: "Global history length."}
    HISTORY_ZONE: {type: i32, value: 100, doc: "Zone history length."}
    HISTORY_PARTY: {type: i32, value: 100, doc: "Party history length."}
    HISTORY_WHISPER: {type: i32, value: 100, doc: "Per conversation."}
    HISTORY_WHISPER_TTL_S: {type: i32, value: 86400, doc: "Whisper history lifetime."}
    HISTORY_SYSTEM: {type: i32, value: 50, doc: "System history length."}
    PARTY_MAX: {type: i32, value: 4, doc: "Party size (spec 16 default)."}
    FRIENDS_MAX: {type: i32, value: 200, doc: "Friends list cap."}
    PARTY_RECONNECT_GRACE_S: {type: i32, value: 300, doc: "Party membership survives a reconnect this long."}
    PRESENCE_TTL_S: {type: i32, value: 30, doc: "Presence key TTL; heartbeat refreshes it."}
    REPORT_CONTEXT_MESSAGES: {type: i32, value: 50, doc: "Messages captured with a report."}

  gameplay:
    DAY_LENGTH_S: {type: i32, value: 3600, doc: "One in-game day is 60 real minutes."}
    MOON_CYCLE_NIGHTS: {type: i32, value: 8, doc: "Seeded moon cycle length."}
    INVENTORY_SLOTS: {type: i32, value: 40, doc: "Main inventory size."}
    PICKUP_DESPAWN_S: {type: i32, value: 600, doc: "Dropped items despawn after 10 minutes."}
    MAX_EQUIPPED_SPELLS: {type: i32, value: 4, doc: "Off-hand spell slots."}
    MAX_PERSONAL_PINS: {type: i32, value: 10, doc: "Map pins per player."}
    WEATHER_STUB_WINDOW_S: {type: i32, value: 600, doc: "WP10 weather stub (until WP15): world time is cut into windows this long; each is rainy or dry from a hash of (seed, window)."}
    WEATHER_STUB_RAIN_PCT: {type: i32, value: 25, doc: "WP10 weather stub: percent of windows that rain."}

  night:
    # ---- WP15 (CR 011): the world clock, demons, ward gardens, town defense
    # and the chemistry engine (spec 8). The clock, weather, wind and the fire
    # simulation are evaluated identically by the zone (server/pkg/weather,
    # server/zone/internal/chem) and the client (client/src/systems), so every
    # number that feeds them lives here.
    DUSK_HOUR: {type: f64, value: 18.5, doc: "Hour of the in-game day demons rise (the sun is just below the horizon; the sky's sun crosses it at 18:00)."}
    DAWN_HOUR: {type: f64, value: 6, doc: "Sunrise: demons caught in the open burn, the rest flee to caves and lairs. Night n runs from DUSK_HOUR of day n to DAWN_HOUR of day n + 1."}
    DEMON_STAGGER_COOLDOWN_S: {type: f64, value: 1.2, doc: "An ordinary hit staggers a demon (interrupts its wind-up, short knockback) at most this often."}
    DEMON_SPAWN_EVERY_S: {type: i32, value: 5, doc: "How often the zone tops up the demons around players at night."}
    DEMON_PER_PLAYER: {type: f64, value: 4, doc: "Lesser demons hunting each player in the open on a new-moon night at demonIntensity 0.5 (scaled by the moon and demonIntensity / 0.5)."}
    DEMON_SPAWN_MIN_M: {type: f64, value: 34, doc: "Demons rise at least this far from the player they hunt (spec 8: from shadowed ground) ..."}
    DEMON_SPAWN_MAX_M: {type: f64, value: 58, doc: "... and at most this far."}
    DEMON_HUNT_LEASH_M: {type: f64, value: 160, doc: "Demons chase this far from where they rose (camps use ENEMY_LEASH_M)."}
    WARD_MARGIN_M: {type: f64, value: 10, doc: "A settlement's ward covers its radius plus this margin: demons cannot enter it and ignore players inside it (spec 8: towns are warded by gardens of a flowering plant demons cannot pass)."}
    LANTERN_WARD_M: {type: f64, value: 5, doc: "Lesser demons will not step within this distance of a road lantern."}
    DEFENSE_CHANCE: {type: f64, value: 0.18, doc: "Chance that a settlement's ward weakens on a new-moon night at demonIntensity 0.5 (scaled by the moon and the intensity): a town defense event."}
    DEFENSE_JOIN_M: {type: f64, value: 160, doc: "A defense event runs only while a player is this close to the settlement (anyone nearby can join; participants are players inside it)."}
    DEFENSE_WAVES: {type: i32, value: 3, doc: "Waves of demons in a town defense event."}
    DEFENSE_WARNING_S: {type: f64, value: 15, doc: "Warning before the first wave (the ward falters)."}
    DEFENSE_BREAK_S: {type: f64, value: 12, doc: "Lull between waves."}
    WARD_HEALTH: {type: i32, value: 1000, doc: "Ward garden health in a defense event; at 0 the ward breaks and demons roam the town until dawn."}
    WARD_DAMAGE_PER_S: {type: f64, value: 12, doc: "Ward damage per second from each demon at the garden."}
    CHEM_STEP_HZ: {type: i32, value: 5, doc: "Chemistry simulation rate: step k is world time k / CHEM_STEP_HZ seconds; every client runs the same steps from the same events (spec 8: sync events, not results)."}
    CHEM_OP_LEAD_STEPS: {type: i32, value: 3, doc: "The zone schedules an ignite/freeze/extinguish this many steps ahead of its own step, so the event reaches clients before it takes effect."}
    CHEM_CLIENT_DELAY_STEPS: {type: i32, value: 2, doc: "Clients simulate this many steps behind their estimate of the zone's step (more latency headroom; a late op is applied at once and counted)."}
    CHEM_CHUNK_CELLS: {type: i32, value: 32, doc: "Chemistry chunk edge in cells (32 x MATERIAL_GRID_M = 64 m = CHUNK_SIZE_M): the unit of baselines and bitmaps."}
    CHEM_INTEREST_M: {type: f64, value: 256, doc: "Clients receive chemistry events and baselines for chunks within this distance."}
    CHEM_BITMAP_HZ: {type: i32, value: 2, doc: "Bitmap fallback rate per active chunk (spec 8: server-sent burned-cell bitmaps per chunk at 2 Hz)."}
    CHEM_WIND_WINDOW_S: {type: i32, value: 120, doc: "The chemistry wind (direction sector and strength) changes every this many seconds of world time, seeded."}
    FIRE_GRASS_SPREAD_PERMILLE: {type: i32, value: 2, doc: "Per step, per burning orthogonal neighbor, chance in 1000 that dry grass catches (before wind and rain)."}
    FIRE_BRUSH_SPREAD_PERMILLE: {type: i32, value: 2, doc: "Same for woody brush (forest undergrowth): slower to catch, burns longer."}
    FIRE_DAMP_SPREAD_PERMILLE: {type: i32, value: 1, doc: "Same for damp wetland grass."}
    FIRE_GRASS_BURN_STEPS: {type: i32, value: 80, doc: "A grass cell burns this many steps plus a seeded 0..FIRE_BURN_JITTER_STEPS (spec 8: burns out in about 20 s)."}
    FIRE_BRUSH_BURN_STEPS: {type: i32, value: 110, doc: "Brush burn time in steps (plus jitter)."}
    FIRE_BURN_JITTER_STEPS: {type: i32, value: 40, doc: "Seeded extra burn steps per cell."}
    FIRE_REGROW_STEPS: {type: i32, value: 18000, doc: "Burnt cells regrow after one in-game day (3600 s at 5 Hz)."}
    FIRE_RAIN_OUT_PERMILLE: {type: i32, value: 40, doc: "While it rains, each burning cell goes out with this chance in 1000 per step, and spread chances are divided by 5."}
    FIRE_MAX_BURNING: {type: i32, value: 1200, doc: "No new spread while this many cells burn (bounds the zone's and clients' work)."}
