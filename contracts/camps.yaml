# Camps (playtest 2, CR 025): Valheim-flavoured camp pieces a player can
# craft as kits, place in the wild, use and pick up again. No base
# building: one camp area per character, a handful of pieces.
#
# `npm run gen` normalizes this file into
#   contracts/ts/src/gen/camps.ts           (client: names, footprints, rules, the ghost)
#   server/pkg/campdefs/camps_gen.json      (zone: placement rules, collision, fire, rest)
# so the placement preview, the collision twin and the zone agree on every
# number. The generator (contracts/codegen/lib/camps.mjs) checks every kit
# item against items.yaml.
#
# PIECE KEYS AND IDS ARE A CONTRACT: ids are the pieces' order here (1-based),
# stored in camp_pieces.kind (migration 0026) and sent on the wire (Interact
# 90, Events 1100-1119). Append, never reorder.
version: 1

# One camp per character: every piece within `campRadiusM` of the camp's
# first piece, at most `maxPieces`, each kind at most its own `max`.
limits:
  maxPieces: 6
  campRadiusM: 18
  reachM: 7            # place, pick up and use from this far (feet to piece, horizontal)

placement:
  rotSteps: 8          # rotation in 45 degree steps (exact cos/sin on both sides)
  maxSlopeDeg: 28      # the footprint's height spread / its diagonal
  maxSpreadM: 0.9      # and never more than this between its corners
  townMarginM: 14      # outside every settlement's radius + this
  otherCampM: 8        # this far from another character's pieces
  gapM: 0.25           # pieces never overlap (footprints grown by this)
  bodyClearM: 0.2      # solid pieces: no player or NPC this close to the footprint
  maxDepthM: 2.5       # feet no deeper than this under the terrain (no camps in caves)

# Decay: a camp whose owner has not come within `visitM` of it for `days`
# real days is taken by the wilds (pieces removed; a chest's items go with it).
decay:
  days: 14
  visitM: 48
  checkEveryS: 600

# Campfire: burns on firewood (in-game hours; DAY_LENGTH_S is one in-game day).
# While it burns, demons never rise within `safeRadiusM` and never step into
# it, and players inside are left alone (WP15).
fire:
  wood: wood:firewood
  kitHours: 3          # a new campfire is lit with the kit's wood
  hoursPerWood: 2
  maxHours: 12
  safeRadiusM: 14
  warmthM: 8           # resting this close to a burning fire rests longer

# Resting in a bedroll (it also sets your respawn point): the Rested buff.
rested:
  durationS: 600
  fireBonusS: 420      # extra when a campfire burns within fire.warmthM
  staminaBonus: 25     # stamina wheel points (rides SelfState: prediction adopts it)
  regenMult: 2.0       # health regen while Rested
  manaRegenMult: 1.5
  combatLockS: 8       # cannot rest this soon after a fight

chest:
  slots: 16

# Pieces. footprint: [width (local x), depth (local z)] metres; height: top of
# the piece above its base; solid: players and enemies collide with its box
# (the TS/Go twin server/pkg/camps + client/src/ui/camps/collide.ts);
# low pieces (a campfire ring, a bedroll) are not solid.
pieces:
  campfire: {name: Campfire, kit: camp:campfire, footprint: [1.6, 1.6], height: 0.45, solid: false, max: 2, desc: "Light and warmth. Cook on it. Demons keep away while it burns."}
  bedroll: {name: Bedroll, kit: camp:bedroll, footprint: [1.3, 2.3], height: 1.2, solid: false, max: 1, desc: "Rest to become Rested. Sets your respawn point."}
  chest: {name: Storage Chest, kit: camp:chest, footprint: [1.2, 0.75], height: 0.85, solid: true, max: 2, desc: "16 slots. Locked to you, or shared with your party."}
  workbench: {name: Workbench, kit: camp:workbench, footprint: [1.9, 0.9], height: 1.0, solid: true, max: 1, desc: "Make tools, arrows and rope away from town."}
  signpost: {name: Signpost, kit: camp:signpost, footprint: [0.5, 0.5], height: 2.3, solid: true, max: 2, desc: "A named marker on your and your party's map."}
