# Lodestone zone wire protocol (spec section 9).
#
# One definition, generated into:
#   contracts/ts/src/protocol.ts          (client, tools)
#   server/pkg/proto/protocol.go          (zone server, bots)
#   contracts/golden/protocol_vectors.json (byte vectors both sides must match)
# Hand-edited codecs are not allowed: edit this file and run `npm run gen`.
#
# Framing: every frame is [msgId u8][body]. All integers little-endian.
#   string  = u16 byte length + UTF-8 bytes
#   bytes   = u32 byte length + raw bytes
#   list<T> = u16 count + items
#   u64/i64 are bigint in TypeScript.
# Masked structs ("mask: u16") write their `always` fields first, then the mask,
# then each remaining field, in declaration order, only if its bit is set. Bit n
# is the n-th non-always field. Absent fields cost zero bytes; this is how
# snapshot deltas against the client's acknowledged baseline stay small (the
# generalization of wizard-wars' cold-field wire cache).
#
# Quantization (portfolio protocol.ts in spirit): positions int32 centimeters,
# yaw/pitch one byte each for others (u16 for your own input), velocity int16
# cm/s, health a byte of percent for others and exact for yourself.
#
# Versioning: adding a message or appending a field to a masked struct is a
# compatible change (bump `version`, note it in docs/cr/). Changing the meaning
# or order of an existing field is not; that needs a new message id.
version: 7   # v7 (docs/cr/040-world-edits.md): TerrainEdits (73); v6 (docs/cr/034-visible-armor.md): EntityRecord.appearance; v2: WP10 movement (docs/cr/004-wp10-movement.md); v3 (docs/cr/005-voice-speaking-and-earshot.md): InputFlag.speaking; v4 (docs/cr/009-wp13-combat.md): combat flag semantics, moveExt dash bits; v5 (docs/cr/008-zone-handoff.md): ZoneTransfer kind + wtEndpoint

enums:
  EntityKind:
    type: u8
    values: {player: 1, enemy: 2, projectile: 3, pickup: 4, npc: 5, demon: 6, effect: 7}
  MoveMode:
    type: u8
    values: {ground: 0, air: 1, climb: 2, glide: 3, swim: 4, fly: 5}
  Transport:
    type: u8
    values: {websocket: 1, webtransport: 2}
  EditKind:
    type: u8
    values: {vein_mined: 1, object_burned: 2, object_frozen: 3, object_destroyed: 4, pillar_raised: 5}
  KickCode:
    type: u16
    values: {bad_ticket: 1, version_mismatch: 2, duplicate_login: 3, server_full: 4, rate_limited: 5, shutdown: 6, transferred: 7}

flags:
  InputFlag:
    # WP13 (CR 009) combat semantics, all decided by the client's step-synchronous
    # combat timeline (client/src/combat/timeline.ts) and replayed by the zone:
    #   attack     set on exactly ONE step per primary attack START (after the
    #              input buffer); the zone logs it at that frame's seq
    #   alt_attack HELD while the secondary button is held (bow draw, spear
    #              charge, sword parry on its rising step); an attack step that
    #              follows held alt_attack steps is the charged/released move
    #   dodge      set on exactly one step per dodge or mobility spell; castSlot
    #              then carries the dash variant (0 = plain dodge, else
    #              combat.yaml dashes id). The shared movement step applies it.
    #   cast       set on exactly one step per spell cast; castSlot = 0..3 (CR 039: 6..9 = spell slots 5..8; 4 and 5 are the form and the technique)
    #   interact   set on one step per consumable use (WP13 healing draught)
    #   channel    (CR 020) HELD while the cast key of a hold-to-fire (auto) or
    #              hold-to-empower (charge) spell stays down after the `cast`
    #              step that started it; a step without it (or with attack,
    #              dodge or cast) ends the stream / releases the charge. Held,
    #              not one-step: a repeated lost frame keeps it, like movement.
    #              Old zones ignore it and old clients never set it, so the
    #              protocol version is unchanged.
    type: u16
    # speaking (v3, WP11): the client is transmitting voice right now; the zone
    # mirrors it into Activity.speaking so far players' nameplates show it. Bit
    # 15, not 14, so movement packages can keep appending from 14 (CR 020 took
    # 14 for channel; movement appends no more flags).
    bits: {forward: 0, back: 1, left: 2, right: 3, jump: 4, jump_edge: 5, sprint: 6, crouch: 7, attack: 8, alt_attack: 9, dodge: 10, interact: 11, cast: 12, glide_toggle: 13, channel: 14, speaking: 15}
  Activity:
    # Rides in every entity record (portfolio protocol.ts activity-bits idea).
    type: u8
    bits: {climbing: 0, gliding: 1, swimming: 2, casting: 3, emoting: 4, typing: 5, speaking: 6, airborne: 7}

structs:
  InputFrame:
    doc: One 1/60 s movement step. Packets carry the newest frames plus repeats.
    fields:
      seq: u32
      flags: u16
      yaw: u16          # yaw / 2pi * 65536 (u16 for your own input: aim precision matters)
      pitch: i16        # pitch / (pi/2) * 32767
      castSlot: u8      # which equipped spell when `cast` is set (0..3, CR 039: 6..9 for slots 5..8); with `dodge`, the dash variant (WP13)

  EntityRecord:
    doc: Another entity in your interest set. Only changed fields are sent.
    mask: u16
    fields:
      id: {type: u32, always: true}
      kind: EntityKind
      x: i32            # cm
      y: i32
      z: i32
      yaw: u8
      pitch: u8
      vx: i16           # cm/s
      vy: i16
      vz: i16
      healthPct: u8
      activity: u8      # Activity bits
      typeId: u16       # enemy type, item base id, npc role...
      name: string      # sent on first sight only
      level: u8
      partyId: u32      # 0 = none; members get the party ring at any distance
      # v6 (docs/cr/034-visible-armor.md): what a player wears, per armor slot
      # (head, body, legs at bits 0, 17, 34): 6 bits visual id (1 + index of the
      # piece among items.yaml armor, 0 none) | 4 bits material code | 3 bits
      # rarity | 4 bits gem (1 + index in items.yaml gems, 0 none); bit 51 a torch is lit and bits 52-56 the familiar light id (playtest 3, CR 042: server/zone/internal/game/lights.go; the client splits it with BigInt); bits 57-63
      # zero. Changes only on equip/unequip (sent then and on first sight, like
      # every field); 0 (nothing worn) costs nothing. Below 2^53: the inventory
      # event's JSON carries the same number for your own body.
      appearance: u64

  SelfState:
    doc: Your own authoritative state, for reconciliation. Exact health.
    mask: u16
    fields:
      x: i32
      y: i32
      z: i32
      vx: i16
      vy: i16
      vz: i16
      health: u16
      healthMax: u16
      stamina: u16      # x10 (one decimal), for display; moveExt carries it exactly
      staminaMax: u16   # x10
      mode: MoveMode
      airJumps: u8
      activity: u8
      # Movement state bits (WP10, CR 004; client/src/sim/README.md):
      #   bit 0 exhausted (stamina ran out; no sprint/climb/glide until full)
      #   bit 1 drowned (helpless in deep water, respawn at shore pending)
      #   bit 2 sliding (standing on ground steeper than WALKABLE_SLOPE_DEG)
      #   bit 3 mounted (CR 027: riding the spirit steed; only the zone sets
      #         it, the shared step clears it); while mounted bits 4-7 carry
      #         the gait (bits 4-5 trot/walk/gallop, 6 Shift held, 7 backing)
      #   bits 4-7 climb-jump lunge steps remaining (0..15)
      flags: u8
      # WP10 (CR 004, protocol v2): the rest of the movement state a client
      # needs to replay from this snapshot bit-exactly:
      #   bits 0-15  stamina in fine units (x STAMINA_FINE_PER_POINT = x60, exact)
      #   bits 16-23 mode timer in steps (regen delay / rain slip phase / drowning)
      #   bits 24-27 dash steps remaining (WP13, CR 009; protocol v4)
      #   bits 28-31 dodge i-frame steps remaining
      moveExt: u32

  EditRecord:
    doc: One entry of a chunk's append-only edit log (spec 7).
    fields:
      editId: u64
      kind: EditKind
      targetId: u64     # stable generator id (scatter, vein, container...)
      params: bytes
      tick: u32
      expiresAt: f64    # server time ms, 0 = never

messages:
  # ---- client -> server ----
  Hello:
    id: 1
    dir: c2s
    delivery: reliable
    fields:
      protocolVersion: u16
      ticket: bytes     # Ed25519-signed by the director (spec 9 security)
      clientTime: f64
      transport: Transport
      saveBlob: bytes   # local profile signed save, empty for accounts

  Input:
    id: 2
    dir: c2s
    delivery: unreliable
    fields:
      ackTick: u32      # newest snapshot tick received (baseline ack)
      frames: list<InputFrame>

  ClockPing:
    id: 3
    dir: c2s
    delivery: unreliable
    fields:
      t1: f64

  HitClaim:
    id: 4
    dir: c2s
    delivery: reliable
    doc: 'WP13: one predicted hit on one enemy (or, playtest 2, a player you may fight). attackSeq = the input frame seq that started the attack or cast; tick = the newest snapshot tick the client had (what it saw); x/y/z = attack origin, or the impact point for aimed area spells and runes. The zone validates leniently (spec 9) and answers with HitResult. Claims on players are refused unless the PvP rules allow the hit (playtest 2, docs/cr/019-pvp-duels.md: both flagged, different parties, no safe zone; or a duel).'
    fields:
      attackSeq: u32
      attackId: u16     # weapon move or spell id (contracts/combat.yaml)
      targetId: u32
      tick: u32
      x: i32            # attack origin, cm
      y: i32
      z: i32
      yaw: u16
      pitch: i16

  Interact:
    id: 5
    dir: c2s
    delivery: reliable
    fields:
      targetKind: u8
      targetId: u64
      action: u8
      arg: u32

  Bye:
    id: 6
    dir: c2s
    delivery: reliable
    fields:
      reason: u8

  # ---- server -> client ----
  Welcome:
    id: 64
    dir: s2c
    delivery: reliable
    fields:
      protocolVersion: u16
      entityId: u32
      tick: u32
      tickRate: u8
      serverTime: f64
      worldId: string
      seed: u64
      genVersion: string
      x: i32
      y: i32
      z: i32
      name: string

  Snapshot:
    id: 65
    dir: s2c
    delivery: unreliable
    fields:
      tick: u32
      baselineTick: u32   # 0 = full snapshot, else delta against that acked tick
      ackInputSeq: u32
      serverTime: f64
      self: SelfState
      entities: list<EntityRecord>
      removed: list<u32>

  ClockPong:
    id: 66
    dir: s2c
    delivery: unreliable
    fields:
      t1: f64
      t2: f64
      t3: f64

  Event:
    id: 67
    dir: s2c
    delivery: reliable
    doc: Generic gameplay event (damage number, discovery, ignite, loot...). Kinds are defined by the owning package in contracts/events.md.
    fields:
      kind: u16
      entityId: u32
      targetId: u32
      value: i32
      x: i32
      y: i32
      z: i32
      data: bytes

  WorldEdits:
    id: 68
    dir: s2c
    delivery: chunk
    doc: Active edits for a chunk on first interest, then live deltas (list of one).
    fields:
      cx: i32
      cz: i32
      edits: list<EditRecord>

  Kick:
    id: 69
    dir: s2c
    delivery: reliable
    fields:
      code: KickCode
      reason: string

  HitResult:
    id: 70
    dir: s2c
    delivery: reliable
    doc: 'WP13: the verdict on one HitClaim. flags bit 0 crit, bit 1 killed, bit 2 weak (element), bit 3 resisted, bit 4 shield absorbed, bit 5 parried; when refused, flags = refusal reason (contracts/events.md).'
    fields:
      attackSeq: u32
      targetId: u32
      accepted: bool
      damage: u16
      targetHealthPct: u8
      flags: u8

  SaveBlob:
    id: 71
    dir: s2c
    delivery: reliable
    fields:
      blob: bytes

  ZoneTransfer:
    id: 72
    dir: s2c
    delivery: reliable
    doc: "WP16 handoff (docs/cr/008-zone-handoff.md, server/zone/README.md 'Multiple zones'). kind 0 = pre-connect - open a second connection to zoneId and send Hello with ticket; the zone holds it on standby and its Welcome later means ownership moved there (switch the active connection, keep prediction and interpolation). kind 1 = cancel - close the standby connection to zoneId (ticket and endpoints empty)."
    fields:
      zoneId: string
      endpoint: string      # WebSocket URL of the neighbor zone
      ticket: bytes         # single-use handoff token (opaque), valid 60 s
      kind: u8              # 0 pre-connect, 1 cancel (v4)
      wtEndpoint: string    # WebTransport URL (with #certHash=) when the zone offers it, else empty (v4)

  TerrainEdits:
    id: 73
    dir: s2c
    delivery: chunk
    doc: "Playtest 3 world edits (CR 040): the terrain height edits of one chunk. data = n x (u16 LE local vertex index z*64 + x, i8 delta in 0.25 m steps, the vertex's NEW value, 0 clears it); on first interest every non-zero vertex of the chunk (an empty chunk sends nothing), then live deltas for the vertices a swing changed. A chunk owns the vertices x, z = 0..63 of its 64 m square (the +1 edge vertex belongs to the next chunk)."
    fields:
      cx: i32
      cz: i32
      data: bytes
