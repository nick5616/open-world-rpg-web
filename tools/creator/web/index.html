<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lodestone World Creator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121418; --panel: #1b1e24; --panel2: #22262e; --text: #e8e8e8; --muted: #9aa0a8; --line: #2e333c;
        --accent: #d9a441; --accent2: #2d6a9f; --ok: #5cc98a; --warn: #e8a23a; --bad: #e85a5a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header { display: flex; gap: 14px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
      header h1 span { color: var(--accent); }
      #server { color: var(--muted); font-size: 12px; margin-left: auto; }
      .layout { display: grid; grid-template-columns: 400px minmax(0, 1fr); height: calc(100vh - 43px); }
      #controls { overflow-y: auto; border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      #main { overflow-y: auto; padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 768px) minmax(260px, 1fr); gap: 14px; align-content: start; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
      .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; }
      label.row { display: grid; grid-template-columns: 112px 1fr 52px; gap: 8px; align-items: center; margin: 3px 0; }
      label.row .name { color: #cfd3d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      label.row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
      label.row .share { color: #7f8790; font-size: 11px; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      input[type='text'], textarea, select { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; font: inherit; }
      textarea { resize: vertical; min-height: 54px; }
      .inline { display: flex; gap: 6px; align-items: center; }
      .inline > input[type='text'] { flex: 1; }
      button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; white-space: nowrap; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
      button.blue { background: var(--accent2); border-color: var(--accent2); color: #fff; }
      #presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      #presets button { text-align: left; padding: 6px 8px; }
      #presets button small { display: block; color: var(--muted); font-size: 11px; white-space: normal; }
      #presets button.active { border-color: var(--accent); background: #2b2618; }
      .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
      .badge.seed { color: var(--ok); border-color: #2f5a41; }
      .badge.edited { color: var(--accent); border-color: #5a4a26; }
      .field { margin: 6px 0; }
      .field > span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
      #loot { display: flex; flex-wrap: wrap; gap: 4px; }
      #loot label { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 2px 8px; font-size: 12px; cursor: pointer; user-select: none; }
      #loot label.on { border-color: var(--accent); color: var(--accent); }
      #loot input { display: none; }
      .notice { border-left: 3px solid var(--warn); background: #2a2417; padding: 6px 8px; margin-top: 8px; font-size: 12px; border-radius: 0 4px 4px 0; }
      .notice.ok { border-color: var(--ok); background: #17271e; }
      .notice.bad { border-color: var(--bad); background: #2a1717; }
      .previewwrap { position: relative; }
      #map { width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--line); border-radius: 6px; background: #0c0e11; image-rendering: auto; }
      #busy { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.65); padding: 3px 8px; border-radius: 10px; font-size: 11px; color: var(--muted); display: none; }
      body[data-busy='1'] #busy { display: block; }
      #side { display: flex; flex-direction: column; gap: 10px; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      td { padding: 2px 4px; vertical-align: top; }
      td.n { text-align: right; font-variant-numeric: tabular-nums; color: #cfd3d8; }
      .muted { color: var(--muted); }
      .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; }
      .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 1px solid #0006; border-radius: 2px; }
      .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
      .bar > i { display: block; height: 100%; }
      #changes li { margin: 1px 0; }
      #changes { margin: 0; padding-left: 16px; font-size: 12px; }
      #mintlog { font-size: 12px; }
      .legend span { white-space: nowrap; margin-right: 8px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body data-busy="0">
    <header>
      <h1>Lodestone <span>World Creator</span></h1>
      <span class="muted">presets · sliders · live atlas · mint</span>
      <span id="server">connecting…</span>
    </header>
    <div class="layout">
      <aside id="controls">
        <div class="card">
          <h2>World <span id="mode" class="badge seed">seed only</span></h2>
          <div class="field"><span>Name</span><input id="name" type="text" maxlength="60" autocomplete="off" /></div>
          <div class="field">
            <span>Seed (uint64)</span>
            <div class="inline">
              <input id="seed" type="text" inputmode="numeric" autocomplete="off" />
              <button id="random" title="New random seed (keeps your edits)">Random</button>
              <button id="fromseed" class="blue" title="spec_from_seed: every field from the seed (the default path)">From seed</button>
            </div>
          </div>
        </div>
        <div class="card">
          <h2>Presets</h2>
          <div id="presets"></div>
        </div>
        <div class="card" id="vibecard">
          <h2>Vibe text <span class="badge" id="vibebadge">optional</span></h2>
          <textarea id="vibe" maxlength="500" placeholder="drowned cathedral archipelago, cold, lots of caves"></textarea>
          <div class="inline" style="margin-top: 6px"><button id="vibego">Fill sliders from vibe</button><span class="muted" id="vibestatus"></span></div>
          <div id="vibenotice"></div>
        </div>
        <div id="groups"></div>
        <div class="card">
          <h2>Flavor</h2>
          <div class="field"><span>Palette</span><select id="palette"></select></div>
          <div class="field"><span>Name grammar</span><select id="grammar"></select></div>
          <div class="field"><span>Loot themes (up to 4)</span><div id="loot"></div></div>
        </div>
      </aside>
      <section id="main">
        <div>
          <div class="previewwrap">
            <canvas id="map" width="768" height="768"></canvas>
            <div id="busy">generating…</div>
          </div>
          <div class="legend" id="legend" style="margin-top: 6px"></div>
        </div>
        <div id="side">
          <div class="card">
            <h2>Mint</h2>
            <div class="inline"><button id="mint" class="primary" disabled>Mint world</button><span class="muted" id="mintsrc"></span></div>
            <div id="validation"></div>
            <div id="mintlog"></div>
          </div>
          <div class="card" id="stats"><h2>Preview</h2><span class="muted">waiting for worldgen.wasm…</span></div>
          <div class="card"><h2>Regions</h2><div id="regions"></div></div>
          <div class="card"><h2>Minted worlds <button id="refresh" style="padding: 0 6px; font-size: 11px">refresh</button></h2><div id="worlds" class="muted">…</div></div>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
